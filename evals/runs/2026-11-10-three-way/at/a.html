<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atmos: Weather</title>
  <meta name="description" content="Current weather, the next 24 hours, and a 7-day outlook for San Francisco, Tokyo, London and New York.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1816;
      --bg-2: #132421;
      --surface: rgba(236, 244, 240, .055);
      --surface-2: rgba(236, 244, 240, .09);
      --line: rgba(236, 244, 240, .13);
      --text: #eef4f0;
      --muted: #9bb3aa;
      --sun: #ffb36b;
      --teal: #7fd1c2;
      --radius: 18px;
      --radius-lg: 28px;
      --shadow: 0 24px 60px -32px rgba(0, 0, 0, .7);
      --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--sans);
      background:
        radial-gradient(900px 520px at 0% -8%, rgba(127, 209, 194, .16), transparent 60%),
        radial-gradient(800px 480px at 100% 0%, rgba(255, 179, 107, .14), transparent 55%),
        linear-gradient(180deg, var(--bg-2), var(--bg) 70%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; border-radius: 10px; }
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: clamp(1.25rem, 3vw, 1.75rem);
    }
    .eyebrow { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0; }
    .muted { color: var(--muted); }
    .num { font-variant-numeric: tabular-nums; }
    .title { font-family: var(--serif); font-weight: 400; font-size: clamp(1.4rem, 2.6vw, 1.75rem); margin: 0; letter-spacing: -.01em; }

    /* Header controls */
    .field {
      appearance: none;
      background-color: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .55rem 2.4rem .55rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
      background-size: 5px 5px;
      background-repeat: no-repeat;
    }
    .field option { background: var(--bg-2); color: var(--text); }
    .seg {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px;
    }
    .seg button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 600;
      padding: .45rem .95rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color .2s, color .2s;
    }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

    /* Hero */
    .hero {
      overflow: hidden;
      min-height: 330px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2rem;
    }
    .glow {
      position: absolute;
      right: -12%;
      top: -22%;
      width: min(70vw, 480px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 179, 107, .42), rgba(255, 179, 107, 0) 66%);
      pointer-events: none;
    }
    .city { font-family: var(--serif); font-weight: 400; font-size: clamp(2.1rem, 5vw, 3.1rem); line-height: 1.02; margin: .3rem 0 0; letter-spacing: -.02em; }
    .temp {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(7rem, 22vw, 12.5rem);
      line-height: .8;
      letter-spacing: -.05em;
      margin: 0;
      font-variant-numeric: lining-nums;
      display: flex;
      align-items: flex-start;
    }
    .temp .unit { font-size: .3em; color: var(--sun); margin: .18em 0 0 .08em; letter-spacing: 0; font-weight: 400; }
    .cond { display: flex; align-items: center; gap: 1rem; font-size: 1.2rem; margin: 0; }
    .cond-icon { width: 64px; height: 64px; color: var(--sun); flex: none; }
    .cond-sub { margin: .15rem 0 0; font-size: .95rem; color: var(--muted); }

    /* Details tiles */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin: 0; }
    .tile {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: .95rem 1rem 1rem;
      min-height: 124px;
      display: flex;
      flex-direction: column;
    }
    .tile dt { display: flex; align-items: center; gap: .45rem; font-size: .84rem; color: var(--muted); }
    .tile dd { margin: .4rem 0 0; font-family: var(--serif); font-size: 1.7rem; line-height: 1.1; font-variant-numeric: lining-nums; }
    .tile .note { margin: auto 0 0; padding-top: .4rem; font-size: .78rem; color: var(--muted); }
    .icn { width: 17px; height: 17px; color: var(--teal); flex: none; }
    .meter { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: .55rem; }
    .meter > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--sun)); }

    /* Hourly */
    .hscroll { contain: inline-size; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; margin: 0 calc(-1 * clamp(.5rem, 1.5vw, 1rem)); padding: 0 clamp(.5rem, 1.5vw, 1rem) .4rem; }
    .track { --col: 76px; position: relative; width: calc(24 * var(--col)); }
    .track svg { display: block; width: calc(24 * var(--col)); height: 120px; }
    ol.hours { list-style: none; margin: .25rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(24, var(--col)); }
    ol.hours li { display: flex; flex-direction: column; align-items: center; gap: .45rem; padding: .7rem 0; border-radius: 16px; font-size: .84rem; }
    ol.hours li.now { background: var(--surface-2); }
    ol.hours .hi { width: 26px; height: 26px; color: var(--sun); }
    ol.hours .ht { font-family: var(--serif); font-size: 1.1rem; font-variant-numeric: lining-nums; }
    .hscroll::-webkit-scrollbar { height: 8px; }
    .hscroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }

    /* 7-day */
    ol.days { list-style: none; margin: 0; padding: 0; }
    ol.days li {
      display: grid;
      grid-template-columns: 4.5rem 1.75rem 3.25rem 2.75rem 1fr 2.75rem;
      align-items: center;
      gap: .75rem;
      padding: .8rem 0;
      border-top: 1px solid var(--line);
    }
    ol.days li:first-child { border-top: 0; }
    .dn { font-weight: 600; }
    .dic { width: 26px; height: 26px; color: var(--sun); }
    .pop { display: flex; align-items: center; gap: .25rem; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .pic { width: 13px; height: 13px; color: var(--teal); }
    .lo, .hi { font-variant-numeric: tabular-nums; }
    .lo { color: var(--muted); text-align: right; }
    .hi { text-align: left; font-weight: 600; }
    .range { position: relative; height: 6px; border-radius: 99px; background: var(--line); }
    .range .bar { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: linear-gradient(90deg, var(--teal), var(--sun)); }

    .lede { font-size: .95rem; line-height: 1.5; margin: .35rem 0 0; color: var(--muted); }
    .fade-in { animation: rise .6s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 560px) {
      ol.days li { grid-template-columns: 3.4rem 1.5rem 2.4rem 1fr 2.4rem; gap: .6rem; }
      ol.days .pop { display: none; }
      .tiles { gap: .55rem; }
      .tile { padding: .85rem; min-height: 116px; }
      .tile dd { font-size: 1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body class="antialiased">

  <!-- Shared icon set -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.3M12 19.2v2.3M2.5 12h2.3M19.2 12h2.3M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M5.2 18.8l1.6-1.6M17.2 6.8l1.6-1.6"/></g></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z" fill="currentColor"/></symbol>
      <symbol id="i-partly" viewBox="0 0 24 24"><circle cx="8.6" cy="8.4" r="3.8" fill="currentColor"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".9"><path d="M8.6 2.2v1.1M2.4 8.4h1.1M4.3 4.1l.8.8M12.9 4.1l-.8.8"/></g><path d="M9.5 20h8.6a3.6 3.6 0 0 0 .3-7.2 5.2 5.2 0 0 0-9.8 1.6A3.2 3.2 0 0 0 9.5 20z" fill="currentColor" stroke="var(--bg-2)" stroke-width="1.2"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5h10.6a4 4 0 0 0 .5-7.97A6.1 6.1 0 0 0 6.3 9.6 4.6 4.6 0 0 0 7 18.5z" fill="currentColor"/></symbol>
      <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 14h10.6a4 4 0 0 0 .5-7.97A6.1 6.1 0 0 0 6.3 5.1 4.6 4.6 0 0 0 7 14z" fill="currentColor"/><path d="M8 17.2l-1 3.2M12 17.2l-1 3.2M16 17.2l-1 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>

      <symbol id="i-uv" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></g></symbol>

      <symbol id="i-therm" viewBox="0 0 24 24"><path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="17.5" r="1.8" fill="currentColor"/></symbol>
      <symbol id="i-rise" viewBox="0 0 24 24"><path d="M3 17h18M7 17a5 5 0 0 1 10 0M12 5v4M5.6 9.6l1.6 1.6M18.4 9.6l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <header class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 pt-6 flex flex-wrap items-center justify-between gap-4">
    <a href="#top" class="flex items-center gap-2 no-underline text-[var(--text)]" aria-label="Atmos home">
      <svg viewBox="0 0 24 24" class="w-7 h-7" style="color:var(--sun)" aria-hidden="true"><use href="#i-partly"/></svg>
      <span class="font-serif italic text-2xl" style="font-family:var(--serif)">Atmos</span>
    </a>
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2">
        <label for="city" class="eyebrow">City</label>
        <select id="city" class="field">
          <option value="sf" selected>San Francisco</option>
          <option value="tokyo">Tokyo</option>
          <option value="london">London</option>
          <option value="newyork">New York</option>
        </select>
      </div>
      <div class="seg" role="group" aria-label="Temperature unit">
        <button type="button" data-unit="C" aria-pressed="true">°C</button>
        <button type="button" data-unit="F" aria-pressed="false">°F</button>
      </div>
    </div>
  </header>

  <main id="top" class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-[minmax(0,1fr)] lg:grid-cols-12 gap-5 lg:gap-6">

    <!-- Current conditions -->
    <section class="card hero fade-in lg:col-span-7" aria-labelledby="city-name">
      <div class="glow" aria-hidden="true"></div>
      <div>
        <p class="eyebrow">Right now</p>
        <h1 id="city-name" class="city">San Francisco</h1>
        <p class="lede"><span id="region">California</span> · <time id="local-time" datetime="">--</time></p>
      </div>
      <div aria-live="polite">
        <p class="temp"><span id="temp">19</span><span class="unit" id="unit">°C</span></p>
        <p class="cond mt-4">
          <svg class="cond-icon" aria-hidden="true" focusable="false"><use id="cond-icon" href="#i-partly"/></svg>
          <span>
            <span id="cond-text">Partly Cloudy</span>
            <span class="cond-sub" id="hilo">High 22°C · Low 14°C</span>
          </span>
        </p>
      </div>
    </section>

    <!-- Details -->
    <section class="card fade-in lg:col-span-5" aria-labelledby="details-title" style="animation-delay:.08s">
      <div class="flex items-baseline justify-between mb-4">
        <h2 id="details-title" class="title">Conditions</h2>
        <p class="eyebrow" id="details-sub">Live</p>
      </div>
      <dl class="tiles" id="tiles"></dl>
    </section>

    <!-- Hourly -->
    <section class="card fade-in lg:col-span-12" aria-labelledby="hourly-title" style="animation-delay:.14s">
      <div class="flex flex-wrap items-end justify-between gap-2 mb-3">
        <div>
          <h2 id="hourly-title" class="title">Next 24 hours</h2>
          <p class="lede" id="peak"></p>
        </div>
        <p class="eyebrow">Scroll for more</p>
      </div>
      <div class="hscroll" tabindex="0" role="region" aria-label="Hourly forecast, scrollable">
        <div class="track" id="track"></div>
      </div>
    </section>

    <!-- 7-day -->
    <section class="card fade-in lg:col-span-12" aria-labelledby="week-title" style="animation-delay:.2s">
      <div class="flex flex-wrap items-end justify-between gap-2 mb-2">
        <h2 id="week-title" class="title">7-day forecast</h2>
        <p class="eyebrow">Low to high</p>
      </div>
      <ol class="days" id="days"></ol>
    </section>

    <p class="lg:col-span-12 muted text-sm text-center pb-6 m-0">
      Demo data. San Francisco's current conditions follow the brief; other cities, hourly and weekly values are illustrative.
    </p>
  </main>

  <script>
    const CITIES = {
      sf: {
        name: "San Francisco", region: "California, US", tz: "America/Los_Angeles",
        tempC: 19, cond: "Partly Cloudy", icon: "partly", nightIcon: "cloud",

        rise: "6:14 AM", set: "4:58 PM",
        hourly: [23,22,21,20,20,19,19,18,18,19, 21,23,24,25,26,26,25,24,22,21, 20,20,19,19],
        daily: [
          { hi: 26, lo: 18, i: "sun", p: 0 }, { hi: 25, lo: 18, i: "partly", p: 10 },
          { hi: 23, lo: 17, i: "cloud", p: 20 }, { hi: 21, lo: 16, i: "rain", p: 70 },
          { hi: 20, lo: 15, i: "rain", p: 50 }, { hi: 22, lo: 16, i: "partly", p: 15 },

        ]
      },
      london: {
        name: "London", region: "England, UK", tz: "Europe/London",
        tempC: 11, cond: "Light Rain", icon: "rain", nightIcon: "rain",
        hi: 13, lo: 8, feels: 9, humidity: 82, windKmh: 22, windDir: "SW", uv: 1, visKm: 8,
        rise: "7:20 AM", set: "4:10 PM",
        hourly: [11,11,10,10,10,9,9,9,8,8, 9,10,11,11,12,12,13,12,12,11, 11,10,10,9],
        daily: [
          { hi: 13, lo: 8, i: "rain", p: 80 }, { hi: 12, lo: 8, i: "rain", p: 70 },
          { hi: 11, lo: 7, i: "cloud", p: 30 }, { hi: 10, lo: 6, i: "partly", p: 20 },
          { hi: 9, lo: 5, i: "cloud", p: 10 }, { hi: 11, lo: 6, i: "partly", p: 10 },
          { hi: 12, lo: 7, i: "sun", p: 5 }
        ]
      },
      newyork: {
        name: "New York", region: "New York, US", tz: "America/New_York",
        tempC: 9, cond: "Clear", icon: "sun", nightIcon: "moon",
        hi: 12, lo: 4, feels: 6, humidity: 45, windKmh: 16, windDir: "NW", uv: 2, visKm: 16,
        rise: "6:35 AM", set: "4:40 PM",
        hourly: [9,8,8,7,6,6,5,5,4,4, 5,6,8,9,10,11,12,12,11,10, 9,8,7,6],
        daily: [
          { hi: 12, lo: 4, i: "sun", p: 0 }, { hi: 10, lo: 3, i: "partly", p: 5 },
          { hi: 7, lo: 2, i: "cloud", p: 20 }, { hi: 8, lo: 4, i: "rain", p: 60 },
          { hi: 11, lo: 5, i: "partly", p: 10 }, { hi: 13, lo: 6, i: "sun", p: 0 },
          { hi: 12, lo: 6, i: "partly", p: 10 }
        ]
      }
    };

    const LABEL = { sun: "Clear", moon: "Clear night", partly: "Partly cloudy", cloud: "Cloudy", rain: "Rain" };
    const COL = 76; // hour column width in px, matches .track --col
    const state = { city: "sf", unit: "C" };
    const $ = (s) => document.querySelector(s);

    const temp = (c) => Math.round(state.unit === "C" ? c : c * 9 / 5 + 32);
    const tempTxt = (c) => temp(c) + "°";
    const toMin = (s) => { const m = s.match(/(\d+):(\d+)\s*(AM|PM)/); let h = Number(m[1]) % 12; if (m[3] === "PM") h += 12; return h * 60 + Number(m[2]); };
    const fmtHour = (h) => h === 0 ? "12 AM" : h < 12 ? h + " AM" : h === 12 ? "12 PM" : (h - 12) + " PM";
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    function localClock(tz) {
      const d = new Date();
      const hour = Number(new Intl.DateTimeFormat("en-US", { timeZone: tz, hour: "numeric", hourCycle: "h23" }).format(d)) % 24;
      const min = Number(new Intl.DateTimeFormat("en-US", { timeZone: tz, minute: "numeric" }).format(d));
      return { h: hour, minutes: hour * 60 + min };
    }

    function uvLabel(uv) {
      return uv < 3 ? "Low" : uv < 6 ? "Moderate" : uv < 8 ? "High" : uv < 11 ? "Very high" : "Extreme";
    }

    function dayName(tz, i) {
      if (i === 0) return "Today";
      const d = new Date(Date.now() + i * 864e5);
      return new Intl.DateTimeFormat("en-US", { timeZone: tz, weekday: "short" }).format(d);
    }

    function curve(temps) {
      const W = 24 * COL, H = 120, top = 26, bottom = 98;
      const min = Math.min(...temps), max = Math.max(...temps), span = Math.max(max - min, 1);
      const pts = temps.map((t, i) => [(i + 0.5) * COL, top + (1 - (t - min) / span) * (bottom - top)]);
      const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${H} L${pts[0][0].toFixed(1)} ${H} Z`;
      const dots = pts.map((p, i) => i === 0
        ? `<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#ffb36b" stroke="#0d1816" stroke-width="2"/>`
        : `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#eef4f0" opacity=".85"/>`).join("");
      return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">
        <defs><linearGradient id="fillG" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#ffb36b" stop-opacity=".32"/><stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${area}" fill="url(#fillG)"/>
        <path d="${line}" fill="none" stroke="#ffb36b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
      </svg>`;
    }

    function renderHero(c, lc) {
      const now = new Date();
      const night = lc.minutes < toMin(c.rise) || lc.minutes >= toMin(c.set);
      $("#city-name").textContent = c.name;
      $("#region").textContent = c.region;
      const local = new Intl.DateTimeFormat("en-US", { timeZone: c.tz, weekday: "long", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short" }).format(now);
      const t = $("#local-time");
      t.textContent = local;
      t.setAttribute("datetime", now.toISOString());
      $("#temp").textContent = temp(c.tempC);
      $("#unit").textContent = "°" + state.unit;
      $("#cond-icon").setAttribute("href", "#i-" + (night ? c.nightIcon : c.icon));
      $("#cond-text").textContent = c.cond;
      $("#hilo").textContent = `High ${tempTxt(c.hi)} · Low ${tempTxt(c.lo)}`;
    }

    function renderTiles(c, lc) {
      const rise = toMin(c.rise), set = toMin(c.set);
      const sunPct = clamp((lc.minutes - rise) / (set - rise) * 100, 0, 100);
      const windTxt = state.unit === "C" ? `${c.windKmh} km/h` : `${Math.round(c.windKmh * 0.621)} mph`;
      const visTxt = state.unit === "C" ? `${c.visKm} km` : `${Math.round(c.visKm * 0.621)} mi`;
      const tiles = [
        { label: "Feels like", icon: "therm", value: tempTxt(c.feels), note: c.feels < c.tempC ? "Colder than the air" : "Warmer than the air" },
        { label: "Humidity", icon: "drop", value: c.humidity + "%", note: c.humidity >= 60 ? "Humid" : "Comfortable", meter: c.humidity },
        { label: "Wind", icon: "wind", value: windTxt, note: `${c.windDir} · ${c.windKmh < 20 ? "light breeze" : "breezy"}` },
        { label: "UV index", icon: "uv", value: String(c.uv), note: uvLabel(c.uv), meter: c.uv / 11 * 100 },
        { label: "Visibility", icon: "eye", value: visTxt, note: c.visKm >= 10 ? "Clear view" : "Reduced visibility" },
        { label: "Sunrise", icon: "rise", value: c.rise, note: `Sunset ${c.set}`, meter: sunPct, meterLabel: "Daylight progress" }
      ];
      $("#tiles").innerHTML = tiles.map((t) => `
        <div class="tile">
          <dt><svg class="icn" aria-hidden="true" focusable="false"><use href="#i-${t.icon}"/></svg>${t.label}</dt>
          <dd>${t.value}</dd>
          ${t.meter != null ? `<div class="meter" aria-hidden="true"><span style="width:${t.meter.toFixed(0)}%"></span></div>` : ""}
          <p class="note">${t.note}</p>
        </div>`).join("");
    }

    function renderHourly(c, lc) {
      const isNightAt = (m) => m < toMin(c.rise) || m >= toMin(c.set);
      const items = c.hourly.map((t, i) => {
        const h = (lc.h + i) % 24;
        const icon = isNightAt(h * 60 + 30) ? c.nightIcon : c.icon;
        const label = i === 0 ? "Now" : fmtHour(h);
        return `<li class="${i === 0 ? "now" : ""}">
          <span>${label}</span>
          <svg class="hi" aria-hidden="true" focusable="false"><use href="#i-${icon}"/></svg>
          <span class="ht">${tempTxt(t)}</span>
          <span class="sr-only">${LABEL[icon] || ""}</span>
        </li>`;
      }).join("");
      const peakIdx = c.hourly.indexOf(Math.max(...c.hourly));
      const peakLabel = peakIdx === 0 ? "now" : fmtHour((lc.h + peakIdx) % 24);
      $("#peak").textContent = `Warmest around ${peakLabel}, reaching ${tempTxt(c.hourly[peakIdx])}.`;
      $("#track").style.setProperty("--col", COL + "px");
      $("#track").innerHTML = `${curve(c.hourly)}<ol class="hours" aria-label="Hour by hour">${items}</ol>`;
    }

    function renderDaily(c) {
      const gLo = Math.min(...c.daily.map((d) => d.lo));
      const gHi = Math.max(...c.daily.map((d) => d.hi));
      const span = Math.max(gHi - gLo, 1);
      $("#days").innerHTML = c.daily.map((d, i) => `
        <li>
          <span class="dn">${dayName(c.tz, i)}</span>
          <svg class="dic" aria-hidden="true" focusable="false"><use href="#i-${d.i}"/></svg>
          <span class="sr-only">${LABEL[d.i]}</span>
          <span class="pop"><svg class="pic" aria-hidden="true" focusable="false"><use href="#i-drop"/></svg>${d.p}%</span>
          <span class="lo num"><span class="sr-only">Low </span>${tempTxt(d.lo)}</span>
          <span class="range" aria-hidden="true"><span class="bar" style="left:${((d.lo - gLo) / span * 100).toFixed(1)}%;width:${((d.hi - d.lo) / span * 100).toFixed(1)}%"></span></span>
          <span class="hi num"><span class="sr-only">High </span>${tempTxt(d.hi)}</span>
        </li>`).join("");
    }

    function render() {
      const c = CITIES[state.city];
      const lc = localClock(c.tz);
      renderHero(c, lc);
      renderTiles(c, lc);
      renderHourly(c, lc);
      renderDaily(c);
      $("#details-sub").textContent = c.name;
    }

    $("#city").addEventListener("change", (e) => { state.city = e.target.value; render(); });
    document.querySelectorAll("[data-unit]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.unit = btn.dataset.unit;
        document.querySelectorAll("[data-unit]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
        render();
      });
    });

    render();
    setInterval(render, 60000);
  </script>
</body>
</html>

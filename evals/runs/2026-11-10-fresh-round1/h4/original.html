<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rootline - Plant care on autopilot 🌿</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    .floaty { animation: floaty 6s ease-in-out infinite; }
    .shimmer { background-size: 200% auto; animation: shimmer 3s linear infinite; }
  </style>
</head>
<body class="bg-gradient-to-br from-emerald-600 via-emerald-500 to-teal-500 min-h-screen text-white overflow-hidden">
  <div class="absolute -top-32 -left-24 w-[420px] h-[420px] rounded-full bg-lime-300/40 blur-3xl"></div>
  <div class="absolute top-40 -right-20 w-[380px] h-[380px] rounded-full bg-teal-300/40 blur-3xl"></div>
  <div class="absolute bottom-0 left-1/3 w-[300px] h-[300px] rounded-full bg-emerald-300/50 blur-3xl"></div>

  <div class="relative min-h-screen flex flex-col">
    <nav class="flex items-center justify-between px-[41px] pt-[23px]">
      <div class="text-2xl font-black tracking-tight">🌿 Rootline ✨</div>
      <div class="hidden md:flex gap-[27px] font-semibold text-white/90">
        <a href="#" class="hover:text-lime-200">Features 🪴</a>
        <a href="#" class="hover:text-lime-200">Pricing 💚</a>
        <a href="#" class="hover:text-lime-200">Blog 📝</a>
      </div>
      <button class="bg-white text-emerald-700 font-extrabold px-[19px] py-[9px] rounded-full shadow-[0_0_25px_rgba(190,242,100,0.7)] hover:scale-105 transition-transform duration-300">Log in 🌱</button>
    </nav>

    <main class="flex-1 flex flex-col items-center justify-center text-center px-[16px] pb-[20px]">
      <div class="shimmer inline-flex items-center gap-[7px] px-[15px] py-[6px] rounded-full bg-gradient-to-r from-lime-300 via-white to-lime-300 text-emerald-800 text-sm font-extrabold shadow-[0_0_20px_rgba(255,255,255,0.6)]">
        🚀 NEW: AI plant ID is here!
      </div>

      <h1 class="mt-[26px] text-7xl font-black leading-[1.02] tracking-[-0.03em] bg-gradient-to-r from-white via-lime-200 to-lime-300 bg-clip-text text-transparent">
        Revolutionize your plant care with AI! 🪴
      </h1>

      <p class="mt-[18px] max-w-[560px] text-lg font-semibold text-white/90">
        Snap a photo, identify any houseplant instantly, and get a watering schedule that never forgets! ✨
      </p>

      <div class="mt-[30px] flex flex-wrap justify-center gap-[15px]">
        <button class="bg-gradient-to-r from-lime-300 to-emerald-300 text-emerald-900 font-black px-[31px] py-[15px] rounded-full shadow-[0_0_35px_rgba(190,242,100,0.8)] hover:scale-110 transition-transform duration-300">Get Started Free 🌿</button>
        <button class="bg-white/15 border border-white/40 backdrop-blur font-black px-[29px] py-[15px] rounded-full shadow-[0_0_30px_rgba(255,255,255,0.35)] hover:scale-110 transition-transform duration-300">See How It Works ✨</button>
      </div>

      <div class="mt-[20px] flex flex-wrap justify-center gap-[11px]">
        <button class="flex items-center gap-[9px] bg-black text-white px-[17px] py-[7px] rounded-full border border-white/30 hover:scale-105 transition-transform">
          <span class="text-xl"></span>
          <span class="text-left leading-tight"><span class="block text-[10px] uppercase tracking-wider">Download on the</span><span class="block font-bold text-sm">App Store</span></span>
        </button>
        <button class="flex items-center gap-[9px] bg-black text-white px-[17px] py-[7px] rounded-full border border-white/30 hover:scale-105 transition-transform">
          <span class="text-xl">▶️</span>
          <span class="text-left leading-tight"><span class="block text-[10px] uppercase tracking-wider">Get it on</span><span class="block font-bold text-sm">Google Play</span></span>
        </button>
      </div>

      <p class="mt-[16px] text-base font-extrabold">⭐ 4.9 from 20,000+ plant parents! 🌱</p>

      <div class="floaty mt-[22px] w-[132px] h-[220px] rounded-[28px] border border-white/50 bg-gradient-to-b from-white/40 to-white/5 backdrop-blur-xl shadow-[0_25px_60px_rgba(0,0,0,0.25)] flex items-center justify-center">
        <div class="w-[112px] h-[196px] rounded-[22px] bg-gradient-to-br from-lime-300 via-emerald-400 to-teal-500 flex items-center justify-center text-7xl">🪴</div>
      </div>
    </main>
  </div>
</body>
</html>

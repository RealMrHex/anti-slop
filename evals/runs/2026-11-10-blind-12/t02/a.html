<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Tasks</title>
<style>
:root{--bg:#f4f5f7;--panel:#e9ebef;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#d8dce3;--accent:#3856d6;--hi:#d92d20;--med:#d97706;--lo:#2e8b57}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--panel:#1d2129;--card:#262b35;--ink:#e8eaee;--mute:#9aa3b2;--line:#363c49;--accent:#7b93ff;--hi:#f97066;--med:#fbb040;--lo:#5ccf93}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px 24px 8px}
h1{font-size:22px;margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.tools input,.tools select{width:auto}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.board{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:16px;padding:12px 24px 32px;align-items:start}
.col{background:var(--panel);border-radius:12px;padding:12px;min-height:200px}
.col.over{outline:2px dashed var(--accent)}
.col h2{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.count{background:var(--card);border-radius:99px;padding:1px 9px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.card.drag{opacity:.4}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.card p{margin:0 0 8px;color:var(--mute);font-size:13px}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.pri{font-weight:600}.pri.high{color:var(--hi)}.pri.medium{color:var(--med)}.pri.low{color:var(--lo)}
.who{margin-left:auto;display:flex;align-items:center;gap:6px}
.av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
.acts{display:flex;gap:4px;margin-top:8px}
.acts button{padding:2px 8px;font-size:12px;border-radius:6px}
.empty{color:var(--mute);font-size:13px;text-align:center;padding:16px 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:760px){.board{grid-template-columns:1fr;padding:12px 16px 24px}header{padding:16px}}
</style>
</head>
<body>
<header>
  <h1>Team Tasks</h1>
  <div class="tools">
    <input id="q" type="search" placeholder="Search tasks" aria-label="Search tasks">
    <select id="fw" aria-label="Filter by assignee"></select>
    <button class="primary" id="add">+ New task</button>
  </div>
</header>
<main class="board" id="board"></main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dt" style="margin:0 0 4px;font-size:18px">New task</h2>
    <label for="f-title">Title</label><input id="f-title" required maxlength="80">
    <label for="f-desc">Details</label><textarea id="f-desc" rows="3"></textarea>
    <div class="row">
      <div><label for="f-who">Assignee</label><select id="f-who"></select></div>
      <div><label for="f-pri">Priority</label><select id="f-pri"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
    </div>
    <div class="foot"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div>
  </form>
</dialog>

<script>
const COLS=[["todo","To do"],["doing","In progress"],["done","Done"]];
const TEAM=["Ana","Ben","Chloe","Dev"];
const KEY="kanban-team-v1";
let tasks;
try{tasks=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(tasks))tasks=[
 {id:1,title:"Draft Q4 roadmap",desc:"Collect input from each lead before Friday.",who:"Ana",pri:"high",col:"todo"},
 {id:2,title:"Fix login redirect bug",desc:"Users land on a blank page after SSO.",who:"Ben",pri:"high",col:"doing"},
 {id:3,title:"Update onboarding docs",desc:"",who:"Chloe",pri:"low",col:"todo"},
 {id:4,title:"Design settings page",desc:"Wireframes approved, needs hi-fi.",who:"Dev",pri:"medium",col:"doing"},
 {id:5,title:"Set up CI caching",desc:"Cut build times by half.",who:"Ben",pri:"medium",col:"done"}];
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let editing=null,dragId=null;

$("#fw").innerHTML='<option value="">Everyone</option>'+TEAM.map(t=>`<option>${t}</option>`).join("");
$("#f-who").innerHTML='<option value="">Unassigned</option>'+TEAM.map(t=>`<option>${t}</option>`).join("");

function render(){
  const q=$("#q").value.toLowerCase(),fw=$("#fw").value;
  $("#board").innerHTML=COLS.map(([id,name])=>{
    const list=tasks.filter(t=>t.col===id&&(!fw||t.who===fw)&&(t.title+t.desc).toLowerCase().includes(q));
    const i=COLS.findIndex(c=>c[0]===id);
    return `<section class="col" data-col="${id}" aria-label="${name}"><h2>${name}<span class="count">${list.length}</span></h2>`+
    (list.map(t=>`<article class="card" draggable="true" data-id="${t.id}">
      <h3>${esc(t.title)}</h3>${t.desc?`<p>${esc(t.desc)}</p>`:""}
      <div class="meta"><span class="pri ${t.pri}">${t.pri[0].toUpperCase()+t.pri.slice(1)}</span>
      <span class="who">${t.who?`<span class="av">${t.who[0]}</span>${t.who}`:"Unassigned"}</span></div>
      <div class="acts">
        ${i>0?`<button data-a="mv" data-d="-1" aria-label="Move left">&larr;</button>`:""}
        ${i<2?`<button data-a="mv" data-d="1" aria-label="Move right">&rarr;</button>`:""}
        <button data-a="ed">Edit</button><button data-a="rm">Delete</button></div></article>`).join("")||'<div class="empty">Nothing here</div>')+`</section>`;
  }).join("");
}

function open(t){
  editing=t;$("#dt").textContent=t?"Edit task":"New task";
  $("#f-title").value=t?t.title:"";$("#f-desc").value=t?t.desc:"";
  $("#f-who").value=t?t.who:"";$("#f-pri").value=t?t.pri:"medium";
  $("#dlg").showModal();$("#f-title").focus();
}
$("#add").onclick=()=>open(null);
$("#cancel").onclick=()=>$("#dlg").close();
$("#form").onsubmit=()=>{
  const d={title:$("#f-title").value.trim(),desc:$("#f-desc").value.trim(),who:$("#f-who").value,pri:$("#f-pri").value};
  if(!d.title)return;
  if(editing)Object.assign(editing,d);else tasks.push({id:Date.now(),col:"todo",...d});
  save();render();
};
$("#q").oninput=$("#fw").onchange=render;

$("#board").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const t=tasks.find(x=>x.id==b.closest(".card").dataset.id);
  if(b.dataset.a==="mv"){const i=COLS.findIndex(c=>c[0]===t.col)+ +b.dataset.d;t.col=COLS[i][0];save();render()}
  else if(b.dataset.a==="ed")open(t);
  else if(b.dataset.a==="rm"&&confirm(`Delete "${t.title}"?`)){tasks=tasks.filter(x=>x!==t);save();render()}
});
const bd=$("#board");
bd.addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(!c)return;dragId=c.dataset.id;c.classList.add("drag");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",dragId)});
bd.addEventListener("dragend",()=>{dragId=null;render()});
bd.addEventListener("dragover",e=>{const c=e.target.closest(".col");if(!c||!dragId)return;e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over"));c.classList.add("over")});
bd.addEventListener("drop",e=>{const c=e.target.closest(".col");if(!c||!dragId)return;e.preventDefault();const t=tasks.find(x=>x.id==dragId);t.col=c.dataset.col;save()});
render();
</script>
</body>
</html>

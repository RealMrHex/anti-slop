<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Summary</title>
<style>
:root{
  --bg:#0f1412; --card:#18201d; --line:#26312d; --text:#eef3f0; --muted:#8fa19a;
  --accent:#c6f432; --accent-ink:#10150a; --pace:#4fd1a5;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f3f6f4; --card:#fff; --line:#dfe7e3; --text:#14201b; --muted:#5f716a; --accent:#2f7d1f; --accent-ink:#fff; --pace:#1f9a73;}
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.screen{max-width:480px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.back{background:none;border:0;color:var(--text);font-size:15px;padding:8px 0;min-height:44px}
.share{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:22px;padding:0 16px;min-height:44px;font-size:15px}
.when{color:var(--muted);font-size:14px}
h1{font-size:26px;letter-spacing:-.01em;margin:2px 0 18px}
.hero{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.hero b{font-size:72px;line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero span{font-size:22px;color:var(--muted)}
.hero-sub{color:var(--accent);font-size:14px;font-weight:600;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.stat strong{font-size:20px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between}
.card h2 span{color:var(--muted);font-weight:400;font-size:13px}
.map{height:130px;border-radius:12px;background:
  radial-gradient(circle at 20% 30%,rgba(127,160,140,.18) 0 18%,transparent 19%),
  repeating-linear-gradient(0deg,transparent 0 24px,var(--line) 24px 25px),
  repeating-linear-gradient(90deg,transparent 0 24px,var(--line) 24px 25px),var(--bg);overflow:hidden}
.map svg{width:100%;height:100%;display:block}
.splits{display:grid;gap:10px}
.split{display:grid;grid-template-columns:24px 1fr 56px;gap:10px;align-items:center;font-variant-numeric:tabular-nums;font-size:14px}
.split i{font-style:normal;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar div{height:100%;background:var(--pace);border-radius:5px}
.split.best .bar div{background:var(--accent)}
.split em{font-style:normal;text-align:right}
.hr{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin-bottom:8px}
.hr div:nth-child(1){background:#5b7a70;flex:5}.hr div:nth-child(2){background:#4fd1a5;flex:25}
.hr div:nth-child(3){background:#c6f432;flex:45}.hr div:nth-child(4){background:#f5a524;flex:20}.hr div:nth-child(5){background:#f0524f;flex:5}
.hrl{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.cta{display:block;width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;min-height:52px;font-size:17px;font-weight:700;margin-top:16px}
.ghost{display:block;width:100%;background:none;border:0;color:var(--muted);min-height:44px;font-size:15px;margin-top:4px}
</style>
</head>
<body>
<main class="screen">
  <header>
    <button class="back">‹ Done</button>
    <button class="share">Share</button>
  </header>
  <div class="when">Tuesday, Nov 10 · 7:12 AM</div>
  <h1>Morning Run</h1>

  <div class="hero"><b>8.42</b><span>km</span></div>
  <div class="hero-sub">Your fastest 8K this year</div>

  <div class="grid">
    <div class="stat"><small>Time</small><strong>44:18</strong></div>
    <div class="stat"><small>Avg pace</small><strong>5:16 /km</strong></div>
    <div class="stat"><small>Calories</small><strong>612</strong></div>
  </div>

  <section class="card">
    <h2>Route <span>Riverside loop</span></h2>
    <div class="map" role="img" aria-label="Route map">
      <svg viewBox="0 0 300 130" preserveAspectRatio="none">
        <path d="M30 100 C50 40 90 30 120 55 S170 110 205 80 S260 30 270 50" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="30" cy="100" r="6" fill="var(--pace)"/><circle cx="270" cy="50" r="6" fill="var(--text)"/>
      </svg>
    </div>
  </section>

  <section class="card">
    <h2>Splits <span>min / km</span></h2>
    <div class="splits">
      <div class="split"><i>1</i><div class="bar"><div style="width:70%"></div></div><em>5:28</em></div>
      <div class="split"><i>2</i><div class="bar"><div style="width:78%"></div></div><em>5:20</em></div>
      <div class="split"><i>3</i><div class="bar"><div style="width:82%"></div></div><em>5:15</em></div>
      <div class="split"><i>4</i><div class="bar"><div style="width:80%"></div></div><em>5:17</em></div>
      <div class="split"><i>5</i><div class="bar"><div style="width:84%"></div></div><em>5:12</em></div>
      <div class="split"><i>6</i><div class="bar"><div style="width:86%"></div></div><em>5:10</em></div>
      <div class="split"><i>7</i><div class="bar"><div style="width:83%"></div></div><em>5:13</em></div>
      <div class="split best"><i>8</i><div class="bar"><div style="width:94%"></div></div><em>5:02</em></div>
    </div>
  </section>

  <section class="card">
    <h2>Heart rate <span>Avg 158 bpm · Max 179</span></h2>
    <div class="hr"><div></div><div></div><div></div><div></div><div></div></div>
    <div class="hrl"><span>Easy</span><span>Aerobic</span><span>Tempo</span><span>Hard</span><span>Max</span></div>
  </section>

  <button class="cta">Save Run</button>
  <button class="ghost">Discard</button>
</main>
</body>
</html>

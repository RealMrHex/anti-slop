<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atmos · Weather for San Francisco</title>
<meta name="description" content="Atmos: current conditions, the next 24 hours and the week ahead for San Francisco, Tokyo, London and New York.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Bricolage Grotesque"', 'ui-rounded', 'system-ui', 'sans-serif'],
          body: ['Figtree', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  /* Sky themes: the page takes the colour of the selected city's sky right now. */
  :root, [data-sky="day"] {
    --sky-top: #7db9ec; --sky-mid: #a9d1f2; --sky-bot: #e3eff8;
    --ink: #0c2238; --ink-2: #284560; --ink-3: #4a6680;
    --card: rgba(255,255,255,.58); --card-strong: rgba(255,255,255,.78);
    --line: rgba(12,34,56,.12); --band: rgba(12,34,56,.06);
    --accent: #e8900c; --curve: #0c2238; --fill-a: rgba(232,144,12,.28); --fill-b: rgba(232,144,12,0);
    --rain: #1f6fd1; --chip-on: #0c2238; --chip-on-ink: #ffffff;
    --shadow: 0 1px 2px rgba(12,34,56,.06), 0 8px 24px -8px rgba(12,34,56,.16);
  }
  [data-sky="dawn"] {
    --sky-top: #8fa6d6; --sky-mid: #d9b7c4; --sky-bot: #f6dcc6;
    --ink: #1d1f3a; --ink-2: #3a3a5c; --ink-3: #5a5876;
    --card: rgba(255,255,255,.55); --card-strong: rgba(255,255,255,.78);
    --line: rgba(29,31,58,.12); --band: rgba(29,31,58,.07);
    --accent: #d9622b; --curve: #1d1f3a; --fill-a: rgba(217,98,43,.26); --fill-b: rgba(217,98,43,0);
    --rain: #2f5fc4; --chip-on: #1d1f3a; --chip-on-ink: #ffffff;
    --shadow: 0 1px 2px rgba(29,31,58,.06), 0 8px 24px -8px rgba(29,31,58,.18);
  }
  [data-sky="dusk"] {
    --sky-top: #232454; --sky-mid: #5b3a6e; --sky-bot: #8a4a62;
    --ink: #fff6ef; --ink-2: #f0dcd6; --ink-3: #d7bcc0;
    --card: rgba(20,14,40,.34); --card-strong: rgba(20,14,40,.5);
    --line: rgba(255,246,239,.16); --band: rgba(0,0,0,.16);
    --accent: #ffb070; --curve: #fff6ef; --fill-a: rgba(255,176,112,.32); --fill-b: rgba(255,176,112,0);
    --rain: #9cc8ff; --chip-on: #fff6ef; --chip-on-ink: #232454;
    --shadow: 0 1px 2px rgba(0,0,0,.12), 0 10px 28px -10px rgba(0,0,0,.4);
  }
  [data-sky="night"] {
    --sky-top: #070d22; --sky-mid: #121d42; --sky-bot: #1f2a57;
    --ink: #eef2ff; --ink-2: #c3cbe6; --ink-3: #9aa5c9;
    --card: rgba(255,255,255,.06); --card-strong: rgba(255,255,255,.1);
    --line: rgba(238,242,255,.13); --band: rgba(0,0,0,.22);
    --accent: #ffd27a; --curve: #eef2ff; --fill-a: rgba(255,210,122,.24); --fill-b: rgba(255,210,122,0);
    --rain: #8fbcff; --chip-on: #eef2ff; --chip-on-ink: #0b1430;
    --shadow: 0 1px 2px rgba(0,0,0,.2), 0 10px 28px -10px rgba(0,0,0,.5);
  }

  html { background: var(--sky-bot); }
  body {
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-bot) 100%) fixed;
    min-height: 100vh;
    transition: color .4s ease;
  }
  .ink-2 { color: var(--ink-2); }
  .ink-3 { color: var(--ink-3); }
  .accent { color: var(--accent); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
  }
  .rule { border-color: var(--line); }

  .temp-hero {
    font-family: "Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(6.5rem, 18vw, 11.5rem);
    line-height: .82;
    letter-spacing: -.055em;
    font-variant-numeric: tabular-nums;
  }
  .tnum { font-variant-numeric: tabular-nums; }

  /* Controls */
  .chip {
    min-height: 40px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font-weight: 500; font-size: .9375rem;
    transition: background-color .15s ease, color .15s ease, transform .1s ease;
  }
  .chip:hover { background: var(--card-strong); }
  .chip:active { transform: scale(.97); }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); }
  .seg button {
    min-width: 44px; min-height: 34px; border-radius: 999px; font-weight: 600; font-size: .9375rem; color: var(--ink-2);
    transition: background-color .15s ease, color .15s ease;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
  .search {
    min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); padding: 0 14px 0 38px; font-size: .9375rem; width: 100%;
  }
  .search::placeholder { color: var(--ink-3); }
  .search:hover { background: var(--card-strong); }
  :focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; }
  .search:focus-visible { outline-offset: 0; }

  /* Hourly strip */
  .hourly-scroll { overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; -webkit-overflow-scrolling: touch; }
  .hourly-scroll:focus-visible { outline-offset: -3px; border-radius: 16px; }
  .hourly-svg text { font-family: Figtree, system-ui, sans-serif; }

  /* 7-day range bar */
  .range { position: relative; height: 6px; border-radius: 999px; background: var(--band); }
  .range > span { position: absolute; top: 0; bottom: 0; border-radius: 999px; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  .fade-in { animation: fade .45s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="font-body antialiased">

<!-- Icon set: one drawing style, coloured by meaning -->
<svg width="0" height="0" class="absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-sun" viewBox="0 0 48 48">
      <g stroke="#f2a516" stroke-width="3" stroke-linecap="round">
        <path d="M24 5v5M24 38v5M5 24h5M38 24h5M10.6 10.6l3.5 3.5M33.9 33.9l3.5 3.5M10.6 37.4l3.5-3.5M33.9 14.1l3.5-3.5"/>
      </g>
      <circle cx="24" cy="24" r="9" fill="#ffc53d" stroke="#f2a516" stroke-width="2"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 48 48">
      <path d="M31 8a16 16 0 1 0 9 26.5A14 14 0 0 1 31 8z" fill="#f3ead0" stroke="#d6c99e" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-cloud-shape" viewBox="0 0 48 48">
      <path d="M14 38h22a8 8 0 0 0 .6-16A11 11 0 0 0 15.4 20 9 9 0 0 0 14 38z" fill="#ffffff" stroke="#8ea3b8" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-pcloudy-day" viewBox="0 0 48 48">
      <g transform="translate(-6 -7) scale(.8)">
        <g stroke="#f2a516" stroke-width="3" stroke-linecap="round"><path d="M24 7v4M8 24h4M12.7 12.7l2.8 2.8M35.3 12.7l-2.8 2.8"/></g>
        <circle cx="24" cy="24" r="8.5" fill="#ffc53d" stroke="#f2a516" stroke-width="2"/>
      </g>
      <use href="#i-cloud-shape" x="3" y="3" width="44" height="44"/>
    </symbol>
    <symbol id="i-pcloudy-night" viewBox="0 0 48 48">
      <g transform="translate(-2 -4) scale(.62)"><path d="M31 8a16 16 0 1 0 9 26.5A14 14 0 0 1 31 8z" fill="#f3ead0" stroke="#d6c99e" stroke-width="2.6" stroke-linejoin="round"/></g>
      <use href="#i-cloud-shape" x="3" y="3" width="44" height="44"/>
    </symbol>
    <symbol id="i-cloudy" viewBox="0 0 48 48">
      <path d="M17 26h18a7 7 0 0 0 .5-14A9.5 9.5 0 0 0 17.6 11 7.5 7.5 0 0 0 17 26z" fill="#dfe7ef" stroke="#8ea3b8" stroke-width="2" stroke-linejoin="round" transform="translate(4 -2)"/>
      <use href="#i-cloud-shape" x="0" y="2" width="46" height="46"/>
    </symbol>
    <symbol id="i-rain" viewBox="0 0 48 48">
      <use href="#i-cloud-shape" x="0" y="-6" width="48" height="48"/>
      <g stroke="#3d8cf0" stroke-width="3" stroke-linecap="round"><path d="M17 36l-2 5M25 36l-2 5M33 36l-2 5"/></g>
    </symbol>
    <symbol id="i-drizzle" viewBox="0 0 48 48">
      <use href="#i-cloud-shape" x="0" y="-6" width="48" height="48"/>
      <g fill="#3d8cf0"><circle cx="17" cy="39" r="1.8"/><circle cx="25" cy="41" r="1.8"/><circle cx="33" cy="39" r="1.8"/></g>
    </symbol>
    <symbol id="i-fog" viewBox="0 0 48 48">
      <use href="#i-cloud-shape" x="0" y="-8" width="48" height="48"/>
      <g stroke="#8ea3b8" stroke-width="3" stroke-linecap="round"><path d="M10 37h28M15 43h22"/></g>
    </symbol>
  </defs>
</svg>

<a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:px-4 focus:py-2 focus:rounded-full" style="background:var(--chip-on);color:var(--chip-on-ink)">Skip to forecast</a>

<header class="mx-auto max-w-6xl px-4 sm:px-6 pt-5 sm:pt-7">
  <div class="flex flex-wrap items-center gap-x-6 gap-y-4">
    <a href="#" class="flex items-center gap-2 mr-auto rounded-full" aria-label="Atmos home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M3 22a13 13 0 0 1 26 0" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="21.5" cy="12.5" r="4" style="fill:var(--accent)"/>
        <path d="M3 27h26" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span class="font-display text-[1.375rem] font-semibold tracking-tight">Atmos</span>
    </a>

    <div class="order-3 lg:order-none w-full lg:w-auto min-w-0 flex flex-col sm:flex-row sm:items-center gap-3">
      <form id="search-form" role="search" class="relative w-full sm:w-64" novalidate>
        <label for="city-search" class="sr-only">Search for a city</label>
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 ink-3 pointer-events-none" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="city-search" class="search" type="search" list="city-options" placeholder="Search a city" autocomplete="off" aria-describedby="search-msg">
        <datalist id="city-options"></datalist>
        <p id="search-msg" class="absolute left-4 top-full mt-1 text-[.8125rem] font-medium" aria-live="polite"></p>
      </form>
      <div class="flex flex-wrap sm:flex-nowrap gap-2 min-w-0" role="group" aria-label="Choose a city" id="city-chips"></div>
    </div>

    <div class="seg" role="group" aria-label="Temperature unit">
      <button type="button" data-unit="C" aria-pressed="true">°C</button>
      <button type="button" data-unit="F" aria-pressed="false">°F</button>
    </div>
  </div>
</header>

<main id="main" class="mx-auto max-w-6xl px-4 sm:px-6 pb-16">

  <!-- Current conditions -->
  <section aria-labelledby="city-name" class="pt-10 sm:pt-14 pb-8 sm:pb-10">
    <div class="grid gap-8 lg:grid-cols-12 lg:items-end">
      <div class="lg:col-span-7">
        <h1 id="city-name" class="font-display text-[2rem] sm:text-[2.5rem] font-semibold tracking-tight leading-none">San Francisco</h1>
        <p class="mt-2 text-[1.0625rem] ink-2"><time id="local-time" class="tnum font-semibold" style="color:var(--ink)">--:--</time> <span id="local-date"></span></p>

        <div class="mt-6 flex items-end gap-4 sm:gap-6">
          <p class="temp-hero" aria-live="polite"><span id="now-temp">19</span><span class="align-top text-[.45em] tracking-normal ml-1" id="now-unit" aria-hidden="true">°</span><span class="sr-only" id="now-temp-sr"></span></p>
          <svg class="w-20 h-20 sm:w-28 sm:h-28 mb-2 shrink-0" aria-hidden="true"><use id="now-icon" href="#i-pcloudy-day"/></svg>
        </div>
        <p class="mt-5 font-display text-[1.5rem] sm:text-[1.75rem] font-medium tracking-tight" id="now-cond">Partly Cloudy</p>
        <p class="mt-1 text-[1.0625rem] ink-2 tnum">
          <span>H <strong class="font-semibold" style="color:var(--ink)" id="now-hi">22°</strong></span>
          <span class="mx-2" aria-hidden="true">·</span>
          <span>L <strong class="font-semibold" style="color:var(--ink)" id="now-lo">14°</strong></span>
          <span class="mx-2" aria-hidden="true">·</span>
          <span>Feels like <strong class="font-semibold" style="color:var(--ink)" id="now-feels">18°</strong></span>
        </p>
      </div>
      <div class="lg:col-span-5 lg:pb-2">
        <p id="summary" class="font-display text-[1.25rem] sm:text-[1.375rem] leading-snug tracking-tight max-w-md lg:ml-auto"></p>
      </div>
    </div>
  </section>

  <!-- Next 24 hours: the focal piece -->
  <section class="card p-4 sm:p-6" aria-labelledby="hourly-h">
    <div class="flex items-baseline justify-between gap-4 mb-3">
      <h2 id="hourly-h" class="font-display text-[1.125rem] font-semibold tracking-tight">Next 24 hours</h2>
      <p class="text-[.875rem] ink-2 hidden sm:block">Scroll for later hours</p>
    </div>
    <div class="hourly-scroll -mx-4 sm:-mx-6 px-4 sm:px-6" tabindex="0" role="region" aria-label="Hourly forecast, scrollable">
      <div id="hourly"></div>
    </div>
    <ol id="hourly-sr" class="sr-only"></ol>
  </section>

  <div class="mt-5 grid gap-5 lg:grid-cols-12">
    <!-- 7-day -->
    <section class="card p-4 sm:p-6 lg:col-span-5 flex flex-col" aria-labelledby="week-h">
      <h2 id="week-h" class="font-display text-[1.125rem] font-semibold tracking-tight mb-2">7-day forecast</h2>
      <ul id="week" class="divide-y rule flex-1 flex flex-col justify-between"></ul>
    </section>

    <!-- Details -->
    <section class="lg:col-span-7" aria-labelledby="details-h">
      <h2 id="details-h" class="sr-only">Weather details</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-5" id="details"></div>
    </section>
  </div>

  <p class="mt-10 text-[.8125rem] ink-2">Forecast data shown is sample data for demonstration. Times are local to each city.</p>
</main>

<script>
(() => {
  // ---------- Data (sample, hardcoded) ----------
  // Conditions: clear | pcloudy | cloudy | rain | drizzle | fog
  const CITIES = {
    sf: {
      name: 'San Francisco', tz: 'America/Los_Angeles',
      now: { t: 19, cond: 'pcloudy', label: 'Partly Cloudy', hi: 22, lo: 14, feels: 18,
             humidity: 64, wind: 12, windDir: 'WSW', uv: 5, vis: 10, sunrise: '06:42', sunset: '19:28' },
      // condition by hour of day 0..23
      hourCond: ['fog','fog','fog','fog','fog','fog','fog','cloudy','cloudy','pcloudy','pcloudy','pcloudy','pcloudy','clear','clear','clear','pcloudy','pcloudy','pcloudy','pcloudy','cloudy','fog','fog','fog'],
      hourRain: Array(24).fill(0),
      week: [
        ['pcloudy', 22, 14, 0], ['clear', 23, 14, 0], ['fog', 19, 13, 10], ['pcloudy', 20, 13, 0],
        ['clear', 24, 15, 0], ['clear', 25, 15, 0], ['pcloudy', 21, 14, 5],
      ],
    },
    tokyo: {
      name: 'Tokyo', tz: 'Asia/Tokyo',
      now: { t: 24, cond: 'clear', label: 'Clear', hi: 27, lo: 19, feels: 25,
             humidity: 58, wind: 9, windDir: 'SE', uv: 6, vis: 16, sunrise: '05:08', sunset: '18:31' },
      hourCond: ['clear','clear','clear','clear','clear','clear','clear','clear','clear','clear','clear','pcloudy','pcloudy','pcloudy','pcloudy','pcloudy','clear','clear','clear','clear','clear','clear','clear','clear'],
      hourRain: Array(24).fill(0),
      week: [
        ['clear', 27, 19, 0], ['pcloudy', 28, 20, 10], ['rain', 23, 19, 80], ['cloudy', 24, 18, 30],
        ['pcloudy', 26, 19, 10], ['clear', 27, 20, 0], ['clear', 28, 21, 0],
      ],
    },
    london: {
      name: 'London', tz: 'Europe/London',
      now: { t: 13, cond: 'drizzle', label: 'Light Rain', hi: 15, lo: 9, feels: 11,
             humidity: 82, wind: 19, windDir: 'SW', uv: 2, vis: 8, sunrise: '06:58', sunset: '19:41' },
      hourCond: ['cloudy','cloudy','cloudy','cloudy','cloudy','drizzle','drizzle','drizzle','rain','rain','drizzle','drizzle','cloudy','cloudy','pcloudy','pcloudy','cloudy','drizzle','drizzle','rain','rain','drizzle','cloudy','cloudy'],
      hourRain: [20,20,25,25,30,45,55,60,75,70,55,45,30,25,15,15,30,50,60,70,65,45,30,25],
      week: [
        ['drizzle', 15, 9, 70], ['rain', 14, 10, 85], ['cloudy', 16, 10, 30], ['pcloudy', 17, 9, 15],
        ['drizzle', 15, 10, 60], ['pcloudy', 18, 11, 10], ['cloudy', 17, 11, 25],
      ],
    },
    ny: {
      name: 'New York', tz: 'America/New_York',
      now: { t: 21, cond: 'clear', label: 'Mostly Sunny', hi: 25, lo: 16, feels: 21,
             humidity: 55, wind: 14, windDir: 'NW', uv: 6, vis: 14, sunrise: '06:29', sunset: '19:38' },
      hourCond: ['clear','clear','clear','clear','clear','clear','clear','clear','clear','clear','clear','pcloudy','pcloudy','pcloudy','clear','clear','clear','clear','clear','clear','clear','clear','pcloudy','pcloudy'],
      hourRain: Array(24).fill(0),
      week: [
        ['clear', 25, 16, 0], ['pcloudy', 26, 18, 10], ['rain', 22, 17, 70], ['pcloudy', 23, 16, 20],
        ['clear', 24, 15, 0], ['clear', 26, 17, 0], ['pcloudy', 25, 18, 10],
      ],
    },
  };
  const ORDER = ['sf', 'tokyo', 'london', 'ny'];
  const COND_LABEL = { clear: 'Clear', pcloudy: 'Partly cloudy', cloudy: 'Cloudy', rain: 'Rain', drizzle: 'Light rain', fog: 'Fog' };

  // ---------- State ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const params = new URLSearchParams(location.search);
  let city = CITIES[store.get('atmos.city')] ? store.get('atmos.city') : 'sf';
  if (CITIES[params.get('city')]) city = params.get('city');
  let unit = store.get('atmos.unit') === 'F' ? 'F' : 'C';
  const forcedHour = params.has('h') ? Number(params.get('h')) : null; // preview aid: ?h=21

  // ---------- Helpers ----------
  const $ = (s) => document.querySelector(s);
  const conv = (c) => unit === 'C' ? Math.round(c) : Math.round(c * 9 / 5 + 32);
  const deg = (c) => `${conv(c)}°`;
  const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
  const fmt12 = (min) => {
    min = ((min % 1440) + 1440) % 1440;
    let h = Math.floor(min / 60), m = min % 60; const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`;
  };
  const hourLabel = (h) => { const ap = h >= 12 ? 'PM' : 'AM'; return `${h % 12 || 12} ${ap}`; };

  function localNow(tz) {
    const d = new Date();
    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour: 'numeric', minute: 'numeric', hourCycle: 'h23', weekday: 'long', month: 'long', day: 'numeric',
    }).formatToParts(d).map(p => [p.type, p.value]));
    let h = Number(parts.hour), m = Number(parts.minute);
    if (forcedHour !== null && !Number.isNaN(forcedHour)) { h = forcedHour; m = 10; }
    return { h, m, min: h * 60 + m, weekday: parts.weekday, date: `${parts.weekday}, ${parts.month} ${parts.day}`, dayIndex: d };
  }

  function isNightAt(c, minuteOfDay) {
    return minuteOfDay < toMin(c.now.sunrise) || minuteOfDay >= toMin(c.now.sunset);
  }
  function skyFor(c, min) {
    const rise = toMin(c.now.sunrise), set = toMin(c.now.sunset);
    if (min >= rise - 45 && min < rise + 60) return 'dawn';
    if (min >= set - 60 && min < set + 45) return 'dusk';
    if (min >= rise + 60 && min < set - 60) return 'day';
    return 'night';
  }
  function iconFor(cond, night) {
    if (cond === 'clear') return night ? 'i-moon' : 'i-sun';
    if (cond === 'pcloudy') return night ? 'i-pcloudy-night' : 'i-pcloudy-day';
    return 'i-' + cond;
  }

  // Diurnal temperature profile by hour of day, anchored on the city's high and low.
  function profileTemp(c, h) {
    const { hi, lo } = c.now;
    // coolest around sunrise, warmest mid-afternoon
    const rise = toMin(c.now.sunrise) / 60, peak = 15;
    let x;
    if (h >= rise && h <= peak) x = (h - rise) / (peak - rise);           // warming
    else { const span = 24 - (peak - rise); const d = (h - peak + 24) % 24; x = 1 - d / span; } // cooling
    x = Math.max(0, Math.min(1, x));
    const s = (1 - Math.cos(Math.PI * x)) / 2;
    return lo + (hi - lo) * s;
  }
  function hourlySeries(c, startHour) {
    const out = [];
    const offset = c.now.t - profileTemp(c, startHour);
    for (let i = 0; i < 24; i++) {
      const h = (startHour + i) % 24;
      const blend = Math.max(0, 1 - i / 3); // current reading eases into the forecast curve
      const t = i === 0 ? c.now.t : profileTemp(c, h) + offset * blend;
      out.push({ i, h, t, cond: i === 0 ? c.now.cond : c.hourCond[h], rain: c.hourRain[h], night: isNightAt(c, h * 60) });
    }
    return out;
  }

  // ---------- Render ----------
  function renderChrome() {
    const chips = $('#city-chips');
    chips.innerHTML = ORDER.map(k => `<button type="button" class="chip whitespace-nowrap" data-city="${k}" aria-pressed="${k === city}">${CITIES[k].name}</button>`).join('');
    $('#city-options').innerHTML = ORDER.map(k => `<option value="${CITIES[k].name}"></option>`).join('');
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.unit === unit)));
  }

  function renderClock() {
    const c = CITIES[city];
    const t = localNow(c.tz);
    $('#local-time').textContent = fmt12(t.min);
    $('#local-date').textContent = `· ${t.date}`;
    document.documentElement.dataset.sky = skyFor(c, t.min);
    document.body.dataset.sky = skyFor(c, t.min);
    return t;
  }

  function render() {
    const c = CITIES[city];
    const t = renderClock();
    const night = isNightAt(c, t.min);
    document.title = `Atmos · ${c.now.label}, ${deg(c.now.t)} in ${c.name}`;

    $('#city-name').textContent = c.name;
    $('#now-temp').textContent = conv(c.now.t);
    $('#now-temp-sr').textContent = ` degrees ${unit === 'C' ? 'Celsius' : 'Fahrenheit'}`;
    $('#now-icon').setAttribute('href', '#' + iconFor(c.now.cond, night));
    $('#now-cond').textContent = c.now.label;
    $('#now-hi').textContent = deg(c.now.hi);
    $('#now-lo').textContent = deg(c.now.lo);
    $('#now-feels').textContent = deg(c.now.feels);

    const series = hourlySeries(c, t.h);
    $('#summary').textContent = summarize(c, series, t);
    renderHourly(c, series, t);
    renderWeek(c, t);
    renderDetails(c, t);
    document.querySelectorAll('#city-chips .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.city === city)));
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.unit === unit)));
    $('main').classList.remove('fade-in'); void $('main').offsetWidth; $('main').classList.add('fade-in');
  }

  function summarize(c, series, t) {
    const next12 = series.slice(1, 13);
    const wet = next12.filter(s => s.rain >= 50);
    if (wet.length) {
      const first = wet[0];
      return `Rain likely around ${hourLabel(first.h)}, ${first.rain}% chance. Keep an umbrella handy; it stays near ${deg(c.now.hi)} at best.`;
    }
    const rest = series.filter(s => s.i < 24 - t.h); // what is left of today
    const peak = rest.reduce((a, b) => (b.t > a.t ? b : a));
    const low = series.slice(0, 12).reduce((a, b) => (b.t < a.t ? b : a));
    if (peak.i > 0 && peak.t - c.now.t >= 1) {
      return `Warming to ${deg(peak.t)} by ${hourLabel(peak.h)}. ${c.now.uv >= 6 ? 'High UV at midday, so bring sunscreen.' : c.now.cond === 'pcloudy' ? 'Clouds come and go; a light layer for later.' : 'A good day to be outside.'}`;
    }
    const fogSoon = next12.find(s => s.cond === 'fog');
    return `Cooling to ${deg(low.t)} by ${hourLabel(low.h)}.${fogSoon ? ` Fog rolls in around ${hourLabel(fogSoon.h)}.` : ' Clear skies overnight.'}`;
  }

  function renderHourly(c, series, t) {
    const W = 68, H = 206, n = series.length, width = W * n;
    const temps = series.map(s => conv(s.t));
    const min = Math.min(...temps), max = Math.max(...temps);
    const top = 112, bottom = 158;
    const y = (v) => max === min ? (top + bottom) / 2 : bottom - (v - min) / (max - min) * (bottom - top);
    const x = (i) => i * W + W / 2;
    const pts = series.map((s, i) => [x(i), y(temps[i])]);

    // smooth path (monotone-ish cubic)
    let d = `M ${pts[0][0]} ${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; const cx = (x0 + x1) / 2;
      d += ` C ${cx} ${y0}, ${cx} ${y1}, ${x1} ${y1}`;
    }
    const area = `${d} L ${pts[n - 1][0]} ${H - 30} L ${pts[0][0]} ${H - 30} Z`;

    // night bands
    // night bands, drawn from the exact sunset to the exact sunrise
    const posOf = (hhmm) => { let m = toMin(hhmm) - t.h * 60; if (m < 0) m += 1440; return (m / 60) * W + W / 2; };
    const xs = posOf(c.now.sunset), xr = posOf(c.now.sunrise);
    let bands = '';
    if (xs < xr) bands = `<rect x="${xs}" y="0" width="${Math.min(width, xr) - xs}" height="${H}" fill="var(--band)"/>`;
    else { bands = `<rect x="0" y="0" width="${xr}" height="${H}" fill="var(--band)"/>`; if (xs < width) bands += `<rect x="${xs}" y="0" width="${width - xs}" height="${H}" fill="var(--band)"/>`; }

    // sunrise / sunset markers within the window
    const markers = [];
    const startMin = t.h * 60;
    [['Sunrise', c.now.sunrise], ['Sunset', c.now.sunset]].forEach(([label, hhmm]) => {
      let m = toMin(hhmm) - startMin; if (m < 0) m += 1440;
      if (m > 0 && m < 1440 - 60) {
        const xx = (m / 60) * W + W / 2; // column centres sit on the hour
        markers.push(`<g><line x1="${xx}" x2="${xx}" y1="64" y2="${H - 30}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 4"/>
          <rect x="${xx - 46}" y="${H - 26}" width="92" height="22" rx="11" fill="var(--card-strong)" stroke="var(--line)"/>
          <text x="${xx}" y="${H - 11}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${label} ${fmt12(toMin(hhmm)).replace(':00', '')}</text></g>`);
      }
    });

    const cols = series.map((s, i) => {
      const cx = x(i);
      const isNow = i === 0;
      const label = isNow ? 'Now' : hourLabel(s.h);
      const rain = s.rain >= 20 ? `<text x="${cx}" y="77" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--rain)">${s.rain}%</text>` : '';
      return `<g>
        <text x="${cx}" y="18" text-anchor="middle" font-size="13" font-weight="${isNow ? 700 : 500}" fill="${isNow ? 'var(--ink)' : 'var(--ink-2)'}">${label}</text>
        <use href="#${iconFor(s.cond, s.night)}" x="${cx - 16}" y="30" width="32" height="32"/>
        ${rain}
        <text x="${cx}" y="${pts[i][1] - 12}" text-anchor="middle" font-size="15" font-weight="${isNow ? 700 : 600}" fill="var(--ink)" class="tnum">${temps[i]}°</text>
      </g>`;
    }).join('');

    const dots = pts.map(([px, py], i) => `<circle cx="${px}" cy="${py}" r="${i === 0 ? 5 : 3}" fill="${i === 0 ? 'var(--accent)' : 'var(--curve)'}" ${i === 0 ? 'stroke="var(--card-strong)" stroke-width="2.5"' : ''}/>`).join('');

    $('#hourly').innerHTML = `<svg class="hourly-svg block" width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" aria-hidden="true">
      <defs><linearGradient id="fillg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--fill-a)"/><stop offset="1" stop-color="var(--fill-b)"/></linearGradient></defs>
      ${bands}
      <path d="${area}" fill="url(#fillg)"/>
      <path d="${d}" fill="none" stroke="var(--curve)" stroke-width="2.25" stroke-linecap="round"/>
      ${markers.join('')}
      ${dots}
      ${cols}
    </svg>`;

    $('#hourly-sr').innerHTML = series.map((s, i) =>
      `<li>${i === 0 ? 'Now' : hourLabel(s.h)}: ${conv(s.t)} degrees, ${COND_LABEL[s.cond].toLowerCase()}${s.rain >= 20 ? `, ${s.rain}% chance of rain` : ''}</li>`).join('');
  }

  function renderWeek(c, t) {
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const todayIdx = days.indexOf(t.weekday);
    const all = c.week.flatMap(d => [d[1], d[2]]);
    const wMin = Math.min(...all), wMax = Math.max(...all);
    const pct = (v) => ((v - wMin) / (wMax - wMin)) * 100;
    $('#week').innerHTML = c.week.map(([cond, hi, lo, rain], i) => {
      const name = i === 0 ? 'Today' : days[(todayIdx + i) % 7].slice(0, 3);
      const full = i === 0 ? 'Today' : days[(todayIdx + i) % 7];
      const left = pct(lo), right = 100 - pct(hi);
      return `<li class="grid items-center gap-3 py-3" style="grid-template-columns: 3.25rem 2.25rem 2.5rem 1fr 2.5rem;">
        <span class="font-semibold"><abbr title="${full}" style="text-decoration:none">${name}</abbr></span>
        <span class="flex flex-col items-center leading-none">
          <svg width="30" height="30" aria-hidden="true"><use href="#${iconFor(cond, false)}"/></svg>
          ${rain >= 20 ? `<span class="text-[.75rem] font-semibold mt-0.5" style="color:var(--rain)">${rain}%</span>` : ''}
        </span>
        <span class="ink-2 text-right tnum">${deg(lo)}</span>
        <span class="range" aria-hidden="true"><span style="left:${left}%;right:${right}%;background:linear-gradient(90deg,#6fb6f0,#ffc53d ${Math.min(100, 40 + pct(hi) / 2)}%, #f08a3c)"></span></span>
        <span class="font-semibold tnum">${deg(hi)}</span>
        <span class="sr-only">${full}: ${COND_LABEL[cond]}, low ${conv(lo)}, high ${conv(hi)} degrees${rain >= 20 ? `, ${rain}% chance of rain` : ''}.</span>
      </li>`;
    }).join('');
  }

  function uvWord(uv) { return uv <= 2 ? 'Low' : uv <= 5 ? 'Moderate' : uv <= 7 ? 'High' : uv <= 10 ? 'Very high' : 'Extreme'; }
  function humidityWord(h) { return h < 30 ? 'Dry' : h < 60 ? 'Comfortable' : h < 80 ? 'A little humid' : 'Damp'; }
  function windWord(w) { return w < 6 ? 'Calm' : w < 12 ? 'Light breeze' : w < 20 ? 'Gentle breeze' : w < 29 ? 'Moderate breeze' : 'Windy'; }
  function visWord(v) { return v >= 10 ? 'Clear view' : v >= 5 ? 'Slight haze' : 'Poor'; }

  function renderDetails(c, t) {
    const n = c.now;
    const tile = (label, value, note, extra = '') => `<div class="card p-4 sm:p-5 flex flex-col min-h-[132px]">
        <h3 class="text-[.8125rem] font-semibold uppercase tracking-[.08em] ink-2">${label}</h3>
        <p class="mt-2 font-display text-[1.875rem] font-medium tracking-tight leading-none tnum">${value}</p>
        ${extra}
        <p class="mt-auto pt-3 text-[.875rem] ink-2">${note}</p>
      </div>`;

    const uvBar = `<div class="mt-3 relative h-1.5 rounded-full" style="background:linear-gradient(90deg,#4cc38a,#e8d33c,#f29b38,#e2534a,#9a5ad6)" aria-hidden="true">
        <span class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3 h-3 rounded-full border-2" style="left:${Math.min(100, n.uv / 11 * 100)}%;background:var(--ink);border-color:var(--card-strong)"></span></div>`;
    const feelsDiff = n.feels - n.t;
    const feelsNote = feelsDiff === 0 ? 'Same as the actual temperature' : feelsDiff < 0 ? `Wind makes it feel ${Math.abs(conv(n.feels) - conv(n.t))}° cooler` : `Humidity makes it feel warmer`;

    // Sun arc
    const rise = toMin(n.sunrise), set = toMin(n.sunset);
    const frac = Math.max(0, Math.min(1, (t.min - rise) / (set - rise)));
    const up = t.min >= rise && t.min < set;
    const ang = Math.PI * (1 - frac);
    const sx = 60 + 50 * Math.cos(ang), sy = 62 - 50 * Math.sin(ang);
    let untilMin = up ? set - t.min : (rise - t.min + 1440) % 1440;
    const untilTxt = untilMin >= 60 ? `${Math.floor(untilMin / 60)} h ${untilMin % 60} min` : `${untilMin} min`;
    const dayLen = set - rise;
    const sunTile = `<div class="card p-4 sm:p-5 col-span-2 sm:col-span-3 flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-8">
        <svg viewBox="0 0 120 70" class="w-full max-w-[200px] h-auto self-center sm:self-auto" aria-hidden="true">
          <path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="2 4"/>
          ${up ? `<path d="M10 62 A50 50 0 0 1 ${sx.toFixed(2)} ${sy.toFixed(2)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>` : ''}
          <line x1="2" x2="118" y1="62" y2="62" stroke="var(--line)" stroke-width="1.5"/>
          ${up ? `<circle cx="${sx.toFixed(2)}" cy="${sy.toFixed(2)}" r="6" fill="#ffc53d" stroke="#f2a516" stroke-width="2"/>` : `<use href="#i-moon" x="50" y="22" width="20" height="20"/>`}
        </svg>
        <div class="grid grid-cols-2 gap-x-8 gap-y-1 flex-1">
          <div><h3 class="text-[.8125rem] font-semibold uppercase tracking-[.08em] ink-2">Sunrise</h3>
            <p class="mt-1 font-display text-[1.625rem] font-medium tracking-tight tnum">${fmt12(rise)}</p></div>
          <div><h3 class="text-[.8125rem] font-semibold uppercase tracking-[.08em] ink-2">Sunset</h3>
            <p class="mt-1 font-display text-[1.625rem] font-medium tracking-tight tnum">${fmt12(set)}</p></div>
          <p class="col-span-2 mt-2 text-[.875rem] ink-2">${up ? `Sunset in ${untilTxt}` : `Sunrise in ${untilTxt}`} · ${Math.floor(dayLen / 60)} h ${dayLen % 60} min of daylight</p>
        </div>
      </div>`;

    $('#details').innerHTML = [
      tile('Feels like', deg(n.feels), feelsNote),
      tile('Humidity', `${n.humidity}%`, humidityWord(n.humidity),
        `<div class="mt-3 h-1.5 rounded-full" style="background:var(--band)" aria-hidden="true"><div class="h-full rounded-full" style="width:${n.humidity}%;background:var(--rain)"></div></div>`),
      tile('Wind', `${n.wind}<span class="text-[1rem] ml-1 font-body font-medium ink-2">km/h</span>`, `${windWord(n.wind)} from the ${n.windDir}`),
      tile('UV index', `${n.uv}<span class="text-[1rem] ml-1.5 font-body font-medium ink-2">${uvWord(n.uv)}</span>`, n.uv >= 6 ? 'Sunscreen and shade at midday' : n.uv >= 3 ? 'Sunscreen if you are out long' : 'No protection needed', uvBar),
      tile('Visibility', `${n.vis}<span class="text-[1rem] ml-1 font-body font-medium ink-2">km</span>`, visWord(n.vis)),
      tile('Rain today', `${c.week[0][3]}%`, c.week[0][3] >= 50 ? 'Take an umbrella' : c.week[0][3] >= 20 ? 'A shower is possible' : 'No rain expected'),
      sunTile,
    ].join('');
  }

  // ---------- Events ----------
  function setCity(k) {
    if (!CITIES[k] || k === city) return;
    city = k; store.set('atmos.city', k); render();
  }
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-city]');
    if (chip) { setCity(chip.dataset.city); $('#search-msg').textContent = ''; }
    const u = e.target.closest('[data-unit]');
    if (u && u.dataset.unit !== unit) { unit = u.dataset.unit; store.set('atmos.unit', unit); render(); }
  });

  function findCity(q) {
    q = q.trim().toLowerCase(); if (!q) return null;
    const alias = { sf: 'sf', 'san fran': 'sf', nyc: 'ny', ny: 'ny', 'new york city': 'ny', tyo: 'tokyo' };
    if (alias[q]) return alias[q];
    return ORDER.find(k => CITIES[k].name.toLowerCase().startsWith(q)) || ORDER.find(k => CITIES[k].name.toLowerCase().includes(q)) || null;
  }
  const input = $('#city-search'), msg = $('#search-msg');
  $('#search-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const k = findCity(input.value);
    if (k) { setCity(k); input.value = ''; msg.textContent = ''; input.removeAttribute('aria-invalid'); }
    else if (input.value.trim()) {
      msg.textContent = 'Try San Francisco, Tokyo, London or New York.';
      msg.style.color = 'var(--ink)';
      input.setAttribute('aria-invalid', 'true');
    }
  });
  input.addEventListener('input', () => {
    // picking from the datalist selects immediately
    const exact = ORDER.find(k => CITIES[k].name.toLowerCase() === input.value.trim().toLowerCase());
    if (exact) { setCity(exact); input.value = ''; msg.textContent = ''; input.removeAttribute('aria-invalid'); }
    else if (msg.textContent) { msg.textContent = ''; input.removeAttribute('aria-invalid'); }
  });

  renderChrome();
  render();
  setInterval(renderClock, 30000);
})();
</script>
</body>
</html>

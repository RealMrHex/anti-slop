<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Today - Habits</title>
<style>
  /* Direction: quick, blunt, a little cheeky. Teens check this between other
     things, so the whole screen is one job: tick things off. System type, heavy
     numerals, one acid-lime signal reserved for "progress / done". */
  :root {
    --bg: #F3F0E8;
    --surface: #FBF9F4;
    --text: #17161A;
    --text-2: #5B5750;
    --line: #D9D4C7;
    --control-border: #8C877B;   /* input borders, >= 3:1 on surface */
    --ring: #17161A;             /* unchecked box outline */
    --check-fill: #17161A;       /* checked box */
    --check-mark: #CDEB3B;
    --hero-bg: #17161A;
    --hero-fg: #F3F0E8;
    --hero-accent: #CDEB3B;
    --seg-on: #CDEB3B;
    --seg-off: #5A5862;
    --focus: #17161A;
    --btn-bg: #17161A;
    --btn-fg: #F3F0E8;
    --error: #A3261B;

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --r-s: 4px; --r-m: 10px; --r-l: 20px; --r-pill: 999px;
    --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121114;
      --surface: #1E1C21;
      --text: #F2EFE8;
      --text-2: #A8A39A;
      --line: #2E2B33;
      --control-border: #8A857C;
      --ring: #F2EFE8;
      --check-fill: #CDEB3B;
      --check-mark: #17161A;
      --hero-bg: #CDEB3B;
      --hero-fg: #17161A;
      --hero-accent: #17161A;
      --seg-on: #17161A;
      --seg-off: #8EA12B;
      --focus: #CDEB3B;
      --btn-bg: #CDEB3B;
      --btn-fg: #17161A;
      --error: #FF8F85;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 96px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 1rem;
    line-height: 1.5;
  }
  button, input, select { font: inherit; color: inherit; }
  h1, h2, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .skip {
    position: absolute; left: var(--s4); top: -100px; z-index: 10;
    background: var(--btn-bg); color: var(--btn-fg);
    padding: var(--s2) var(--s4); border-radius: var(--r-m); font-weight: 700;
  }
  .skip:focus { top: var(--s2); }

  .app {
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  main { flex: 1; padding: var(--s5) var(--s4) var(--s6); }
  @media (min-width: 400px) { main { padding-inline: var(--s5); } }

  /* ---------- Header ---------- */
  .top { margin-bottom: var(--s4); }
  .date {
    font-size: 0.875rem; font-weight: 600; color: var(--text-2);
    letter-spacing: 0.02em;
  }
  h1 {
    font-size: 2rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em;
  }

  /* ---------- Hero: the one anchor on the screen ---------- */
  .hero {
    background: var(--hero-bg);
    color: var(--hero-fg);
    border-radius: var(--r-l);
    padding: var(--s5);
    margin-bottom: var(--s6);
  }
  .hero-row { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
  .hero-num {
    font-size: clamp(3.5rem, 2.5rem + 6vw, 4.5rem);
    line-height: 0.9; font-weight: 800; letter-spacing: -0.04em;
    color: var(--hero-accent);
    font-variant-numeric: tabular-nums;
  }
  .hero-label { font-size: 1.25rem; line-height: 1.2; font-weight: 700; }
  .segs { display: flex; gap: var(--s1); margin-top: var(--s4); }
  .segs span {
    flex: 1; height: 8px; border-radius: var(--r-s); background: var(--seg-off);
    transition: background-color 150ms ease-out;
  }
  .segs span.on { background: var(--seg-on); }
  .hero-sub { margin-top: var(--s3); font-size: 0.9375rem; line-height: 1.4; }

  /* ---------- Habit groups ---------- */
  .group + .group { margin-top: var(--s5); }
  h2 {
    font-size: 0.8125rem; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-2);
    padding-bottom: var(--s2);
    border-bottom: 2px solid var(--text);
  }
  .habit { border-bottom: 1px solid var(--line); position: relative; }
  .habit input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; margin: 0; cursor: pointer;
  }
  .habit label {
    display: flex; align-items: center; gap: var(--s4);
    min-height: 68px; padding: var(--s3) 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .box {
    flex: none; width: 32px; height: 32px;
    border-radius: var(--r-m);
    border: 2px solid var(--ring);
    display: grid; place-items: center;
    transition: background-color 120ms ease-out, border-color 120ms ease-out, transform 120ms ease-out;
  }
  .box svg { width: 18px; height: 18px; opacity: 0; transition: opacity 120ms ease-out; }
  .box svg path { stroke: var(--check-mark); }
  .habit input:checked + label .box { background: var(--check-fill); border-color: var(--check-fill); }
  .habit input:checked + label .box svg { opacity: 1; }
  .habit label:active .box { transform: scale(0.9); }
  .habit input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--r-m); }
  .habit-text { min-width: 0; }
  .habit-name {
    display: block; font-size: 1.0625rem; line-height: 1.3; font-weight: 700;
    overflow-wrap: anywhere;
  }
  .habit-meta {
    display: block; font-size: 0.875rem; line-height: 1.3; color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .habit input:checked + label .habit-name { color: var(--text-2); }

  /* ---------- New habit ---------- */
  .add {
    display: flex; align-items: center; justify-content: center; gap: var(--s2);
    width: 100%; min-height: 52px; margin-top: var(--s6);
    background: transparent; border: 2px solid var(--text); border-radius: var(--r-m);
    font-weight: 700; cursor: pointer;
  }
  .add:hover { background: var(--line); }
  .add:active { transform: scale(0.98); }
  .add svg { width: 18px; height: 18px; }

  /* ---------- Empty ---------- */
  .empty { padding: var(--s6) 0; text-align: center; color: var(--text-2); }
  .empty strong { display: block; color: var(--text); font-size: 1.125rem; margin-bottom: var(--s1); }

  /* ---------- Bottom nav ---------- */
  nav.tabs {
    position: sticky; bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs ul { display: flex; }
  nav.tabs li { flex: 1; }
  nav.tabs a {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    min-height: 60px; padding: var(--s2) var(--s1);
    color: var(--text-2); text-decoration: none;
    font-size: 0.75rem; font-weight: 600;
  }
  nav.tabs a svg { width: 24px; height: 24px; }
  nav.tabs a:hover { color: var(--text); }
  nav.tabs a[aria-current="page"] { color: var(--text); font-weight: 800; }
  nav.tabs a[aria-current="page"]::before {
    content: ""; position: absolute; top: -1px; left: 25%; right: 25%;
    height: 3px; background: var(--text); border-radius: 0 0 var(--r-s) var(--r-s);
  }

  /* ---------- Dialog ---------- */
  dialog {
    width: min(92vw, 400px);
    background: var(--surface); color: var(--text);
    border: 0; border-radius: var(--r-l); padding: var(--s5);
  }
  dialog::backdrop { background: rgba(10, 9, 12, 0.6); }
  dialog h2 {
    font-size: 1.375rem; text-transform: none; letter-spacing: -0.01em;
    color: var(--text); border: 0; padding: 0; margin-bottom: var(--s4);
  }
  .field + .field { margin-top: var(--s4); }
  .field > label, legend {
    display: block; font-size: 0.875rem; font-weight: 700; margin-bottom: var(--s2); padding: 0;
  }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  input[type="text"] {
    width: 100%; min-height: 48px; padding: var(--s2) var(--s3);
    background: transparent; border: 2px solid var(--control-border); border-radius: var(--r-m);
  }
  input[type="text"][aria-invalid="true"] { border-color: var(--error); }
  .err { color: var(--error); font-size: 0.875rem; font-weight: 600; margin-top: var(--s2); }
  .opts { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .opt { position: relative; }
  .opt input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
  .opt label {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s4);
    border: 2px solid var(--control-border); border-radius: var(--r-pill);
    font-size: 0.9375rem; font-weight: 600; margin: 0; cursor: pointer;
  }
  .opt input:checked + label {
    background: var(--check-fill); border-color: var(--check-fill); color: var(--check-mark); font-weight: 800;
  }
  .opt input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
  .actions { display: flex; gap: var(--s3); justify-content: flex-end; margin-top: var(--s5); }
  .btn {
    min-height: 48px; padding: 0 var(--s5); border-radius: var(--r-m);
    font-weight: 800; cursor: pointer; border: 2px solid transparent;
  }
  .btn-primary { background: var(--btn-bg); color: var(--btn-fg); }
  .btn-primary:hover { filter: brightness(1.12); }
  .btn-quiet { background: transparent; border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .habit label:active .box, .add:active { transform: none; }
  }
</style>
</head>
<body>
<a class="skip" href="#habits">Skip to habits</a>
<div class="app">
  <main id="main">
    <header class="top">
      <p class="date" id="date"></p>
      <h1>Today</h1>
    </header>

    <section class="hero" aria-label="Today's progress">
      <div class="hero-row">
        <span class="hero-num" id="heroNum" aria-hidden="true"></span>
        <span class="hero-label" id="heroLabel"></span>
      </div>
      <div class="segs" id="segs" aria-hidden="true"></div>
      <p class="hero-sub" id="heroSub"></p>
    </section>

    <div id="habits"></div>

    <button type="button" class="add" id="addBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New habit
    </button>

    <p class="sr-only" id="status" role="status"></p>
  </main>

  <nav class="tabs" aria-label="Main">
    <ul>
      <li><a href="#" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>
        Today</a></li>
      <li><a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
        Habits</a></li>
      <li><a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>
        Progress</a></li>
      <li><a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
        You</a></li>
    </ul>
  </nav>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="form" method="dialog" novalidate>
    <h2 id="dlgTitle">New habit</h2>
    <div class="field">
      <label for="name">What are you doing?</label>
      <input type="text" id="name" name="name" maxlength="40" autocomplete="off" aria-describedby="nameErr">
      <p class="err" id="nameErr" hidden>Give it a name, even a short one.</p>
    </div>
    <fieldset class="field">
      <legend>When</legend>
      <div class="opts">
        <span class="opt"><input type="radio" name="when" id="w-morning" value="morning" checked><label for="w-morning">Morning</label></span>
        <span class="opt"><input type="radio" name="when" id="w-after" value="after"><label for="w-after">After school</label></span>
        <span class="opt"><input type="radio" name="when" id="w-evening" value="evening"><label for="w-evening">Evening</label></span>
      </div>
    </fieldset>
    <div class="actions">
      <button type="button" class="btn btn-quiet" id="cancel">Cancel</button>
      <button type="submit" class="btn btn-primary">Add habit</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  // PLACEHOLDER DATA: sample habits and streaks for layout only.
  // `streak` = consecutive days completed up to and including yesterday.
  var GROUPS = [
    { key: "morning", title: "Morning" },
    { key: "after",   title: "After school" },
    { key: "evening", title: "Evening" }
  ];
  var habits = [
    { id: 1, name: "Water before phone",           when: "morning", streak: 6, done: true  },
    { id: 2, name: "Pack bag the night before",    when: "morning", streak: 0, done: false },
    { id: 3, name: "Move for 20 minutes",          when: "after",   streak: 3, done: true  },
    { id: 4, name: "Homework: first 30 minutes",   when: "after",   streak: 9, done: false },
    { id: 5, name: "Read 15 minutes",              when: "evening", streak: 2, done: false },
    { id: 6, name: "Phone charges outside bedroom",when: "evening", streak: 4, done: false }
  ];
  var nextId = 7;

  var $ = function (id) { return document.getElementById(id); };
  var host = $("habits");
  var rows = {}; // id -> {input, meta}

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function metaText(h) {
    if (h.done) return (h.streak + 1) + "-day streak";
    if (h.streak > 0) return h.streak + "-day streak on the line";
    return "Day one is today";
  }

  function makeRow(h) {
    var li = document.createElement("li");
    li.className = "habit";
    var input = document.createElement("input");
    input.type = "checkbox";
    input.id = "h" + h.id;
    input.checked = h.done;
    var label = document.createElement("label");
    label.htmlFor = input.id;
    var box = document.createElement("span");
    box.className = "box";
    box.innerHTML = CHECK;
    var text = document.createElement("span");
    text.className = "habit-text";
    var name = document.createElement("span");
    name.className = "habit-name";
    name.textContent = h.name;
    var meta = document.createElement("span");
    meta.className = "habit-meta";
    meta.textContent = metaText(h);
    text.appendChild(name); text.appendChild(meta);
    label.appendChild(box); label.appendChild(text);
    li.appendChild(input); li.appendChild(label);
    input.addEventListener("change", function () {
      h.done = input.checked;
      meta.textContent = metaText(h);
      updateHero(true);
    });
    rows[h.id] = { input: input, meta: meta };
    return li;
  }

  function renderList() {
    host.textContent = "";
    rows = {};
    var any = false;
    GROUPS.forEach(function (g) {
      var items = habits.filter(function (h) { return h.when === g.key; });
      if (!items.length) return;
      any = true;
      var sec = document.createElement("section");
      sec.className = "group";
      sec.setAttribute("aria-labelledby", "g-" + g.key);
      var h2 = document.createElement("h2");
      h2.id = "g-" + g.key;
      h2.textContent = g.title;
      var ul = document.createElement("ul");
      items.forEach(function (h) { ul.appendChild(makeRow(h)); });
      sec.appendChild(h2); sec.appendChild(ul);
      host.appendChild(sec);
    });
    if (!any) {
      var e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = "<strong>Nothing here yet.</strong>Add one small thing you want to do every day.";
      host.appendChild(e);
    }
  }

  function updateHero(announce) {
    var total = habits.length;
    var done = habits.filter(function (h) { return h.done; }).length;
    var left = total - done;
    var num = $("heroNum"), label = $("heroLabel"), sub = $("heroSub"), segs = $("segs");

    segs.textContent = "";
    for (var i = 0; i < total; i++) {
      var s = document.createElement("span");
      if (i < done) s.className = "on";
      segs.appendChild(s);
    }
    if (total === 0) {
      num.textContent = "0";
      label.textContent = "habits yet";
      sub.textContent = "Start with one. Small counts.";
    } else if (left === 0) {
      num.textContent = "Done";
      label.textContent = "";
      sub.textContent = "That's everything. The rest of today is yours.";
    } else {
      num.textContent = String(left);
      label.textContent = (left === 1 ? "habit" : "habits") + " left today";
      sub.textContent = done + " of " + total + " done";
    }
    if (announce) {
      $("status").textContent = total ? done + " of " + total + " done today" : "";
    }
  }

  // Date (falls back to nothing if Intl is unavailable)
  try {
    $("date").textContent = new Intl.DateTimeFormat(undefined, { weekday: "long", day: "numeric", month: "long" }).format(new Date());
  } catch (e) {}

  // New habit dialog
  var dlg = $("dlg"), form = $("form"), nameIn = $("name"), err = $("nameErr");
  function closeDlg() { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
  $("addBtn").addEventListener("click", function () {
    form.reset();
    err.hidden = true;
    nameIn.removeAttribute("aria-invalid");
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    nameIn.focus();
  });
  $("cancel").addEventListener("click", closeDlg);
  nameIn.addEventListener("input", function () {
    if (nameIn.value.trim()) { err.hidden = true; nameIn.removeAttribute("aria-invalid"); }
  });
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var value = nameIn.value.trim();
    if (!value) {
      err.hidden = false;
      nameIn.setAttribute("aria-invalid", "true");
      nameIn.focus();
      return;
    }
    var when = form.elements["when"].value;
    habits.push({ id: nextId++, name: value, when: when, streak: 0, done: false });
    renderList();
    updateHero(false);
    $("status").textContent = "Added " + value;
    closeDlg();
  });

  renderList();
  updateHero(false);
})();
</script>
</body>
</html>

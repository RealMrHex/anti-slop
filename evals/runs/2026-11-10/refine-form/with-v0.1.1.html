<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a repair — Spoke &amp; Sprocket</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; font-size: 16px; line-height: 1.5; color: #000; background: #fff; margin: 0; }
  main { max-width: 34rem; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  h1 + p { color: #3d3d3d; margin: 0 0 8px; }
  h2 { font-size: 18px; line-height: 1.3; margin: 40px 0 16px; padding-bottom: 8px; border-bottom: 1px solid #c4c4c4; }
  label, legend { font-weight: bold; }
  label { display: block; margin: 20px 0 6px; }
  h2 + label { margin-top: 0; }
  input, select, textarea { font: inherit; width: 100%; border: 1px solid #5f5f5f; border-radius: 4px; padding: 10px 12px; margin: 0; background: #fff; color: #000; }
  textarea { resize: vertical; }
  input[aria-invalid="true"] { border-color: #a40000; box-shadow: inset 0 0 0 1px #a40000; }
  input[type="radio"] { width: auto; margin: 0 8px 0 0; accent-color: #0b57d0; }
  fieldset { border: 0; padding: 0; margin: 20px 0 0; min-width: 0; }
  legend { padding: 0; margin-bottom: 6px; }
  fieldset label { display: inline-block; font-weight: normal; margin: 0; padding: 6px 0; }
  .hint, .error { display: block; margin-top: 6px; font-size: 14px; line-height: 1.4; }
  .hint { color: #4a4a4a; }
  .error { color: #a40000; }
  button { font: inherit; min-height: 44px; padding: 8px 20px; border: 1px solid #5f5f5f; border-radius: 4px; background: #fff; color: #000; cursor: pointer; }
  button:hover { background: #f0f0f0; }
  button[type="submit"] { background: #0b57d0; border-color: #0b57d0; color: #fff; font-weight: bold; }
  button[type="submit"]:hover { background: #0a49ad; border-color: #0a49ad; }
  button[type="reset"] { border-color: transparent; background: none; text-decoration: underline; }
  button[type="reset"]:hover { background: #f0f0f0; }
  textarea ~ button { margin: 32px 8px 0 0; }
  :focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <h1>Book a repair</h1>
    <p>We’ll confirm your slot by email within one working day.</p>

    <form id="booking-form" action="/bookings" method="post" novalidate onsubmit="return validateBooking(this)">
      <h2>Your details</h2>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error" aria-invalid="true">
      <span id="email-error" class="error" role="alert">Error: enter an email address in the format name@example.com.</span>

      <label for="phone">Phone (optional)</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" aria-describedby="phone-hint">
      <span id="phone-hint" class="hint">Only used if we have a question about your bike.</span>

      <h2>Your bike</h2>
      <label for="bike-type">Bike type</label>
      <select id="bike-type" name="bike_type" required>
        <option value="">Choose one</option><option>Road</option><option>Mountain</option><option>Hybrid</option><option>E-bike</option>
      </select>

      <fieldset>
        <legend>Service level</legend>
        <input type="radio" id="svc-basic" name="service" value="basic" checked> <label for="svc-basic">Basic tune-up (£45)</label><br>
        <input type="radio" id="svc-full" name="service" value="full"> <label for="svc-full">Full service (£95)</label><br>
        <input type="radio" id="svc-diag" name="service" value="diagnose"> <label for="svc-diag">Not sure, please diagnose (£15)</label>
      </fieldset>

      <label for="notes">What’s wrong? (optional)</label>
      <textarea id="notes" name="notes" rows="4"></textarea>

      <button type="submit" data-testid="submit-booking">Request booking</button>
      <button type="button" onclick="history.back()">Cancel</button>
      <button type="reset">Clear form</button>
    </form>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a repair — Spoke &amp; Sprocket</title>
<style>
  :root {
    --bg: #f5f3ef; --surface: #fff; --text: #1d2321; --muted: #5a6561;
    --line: #c9cfcc; --accent: #0f6b4f; --accent-hover: #0b5640; --accent-soft: #e6f2ed;
    --danger: #a40000; --danger-soft: #fdeeee; --focus: #0b57d0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816; --surface: #1d2321; --text: #eef1ef; --muted: #a3aeaa;
      --line: #46504c; --accent: #4fc79c; --accent-hover: #7bdbb8; --accent-soft: #1f3a31;
      --danger: #ff8f8f; --danger-soft: #3a1f1f; --focus: #8ab4ff;
    }
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 16px; line-height: 1.5; color: var(--text); background: var(--bg); margin: 0; padding: 32px 16px; }
  main { max-width: 560px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 32px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  main > p { margin: 0 0 24px; color: var(--muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  form > h2:first-child { margin-top: 0; }
  label, legend { display: block; font-weight: 600; margin-bottom: 6px; }
  legend { padding: 0; }
  input, select, textarea { font: inherit; color: inherit; background: var(--surface); width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 20px; }
  textarea { resize: vertical; }
  input:hover, select:hover, textarea:hover { border-color: var(--muted); }
  input[aria-invalid="true"] { border-color: var(--danger); background: var(--danger-soft); margin-bottom: 8px; }
  input[aria-describedby="phone-hint"] { margin-bottom: 8px; }
  input[type="radio"] { width: 18px; height: 18px; padding: 0; margin: 0; accent-color: var(--accent); flex: none; }
  fieldset { border: 0; padding: 0; margin: 0 0 20px; }
  fieldset label { display: block; font-weight: 400; margin: 0; padding: 10px 12px 10px 40px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  fieldset input[type="radio"] { float: left; clear: left; margin: 14px 0 0 12px; }
  fieldset label:hover { border-color: var(--muted); }
  fieldset input[type="radio"]:checked + label { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  fieldset br { display: none; }
  fieldset label { margin-bottom: 8px; }
  .hint, .error { display: block; font-size: 14px; margin-bottom: 20px; }
  .hint { color: var(--muted); }
  .error { color: var(--danger); font-weight: 500; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button[type="submit"] { background: var(--accent); border-color: var(--accent); color: #fff; order: -1; }
  button[type="submit"]:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  @media (prefers-color-scheme: dark) { button[type="submit"] { color: #08231b; } }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  @media (max-width: 480px) { body { padding: 0; } main { border: 0; border-radius: 0; padding: 24px 16px; } button { flex: 1 1 100%; } }
</style>
</head>
<body>
  <main>
    <h1>Book a repair</h1>
    <p>We’ll confirm your slot by email within one working day.</p>

    <form id="booking-form" action="/bookings" method="post" novalidate onsubmit="return validateBooking(this)">
      <h2>Your details</h2>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error" aria-invalid="true">
      <span id="email-error" class="error" role="alert">Error: enter an email address in the format name@example.com.</span>

      <label for="phone">Phone (optional)</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" aria-describedby="phone-hint">
      <span id="phone-hint" class="hint">Only used if we have a question about your bike.</span>

      <h2>Your bike</h2>
      <label for="bike-type">Bike type</label>
      <select id="bike-type" name="bike_type" required>
        <option value="">Choose one</option><option>Road</option><option>Mountain</option><option>Hybrid</option><option>E-bike</option>
      </select>

      <fieldset>
        <legend>Service level</legend>
        <input type="radio" id="svc-basic" name="service" value="basic" checked> <label for="svc-basic">Basic tune-up (£45)</label><br>
        <input type="radio" id="svc-full" name="service" value="full"> <label for="svc-full">Full service (£95)</label><br>
        <input type="radio" id="svc-diag" name="service" value="diagnose"> <label for="svc-diag">Not sure, please diagnose (£15)</label>
      </fieldset>

      <label for="notes">What’s wrong? (optional)</label>
      <textarea id="notes" name="notes" rows="4"></textarea>

      <div class="actions">
      <button type="submit" data-testid="submit-booking">Request booking</button>
      <button type="button" onclick="history.back()">Cancel</button>
      <button type="reset">Clear form</button>
      </div>
    </form>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Usage Dashboard</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#14181f; --muted:#5b6574; --line:#e3e6eb;
  --accent:#2f6fed; --err:#d6453d; --ok:#1f9d63; --warn:#d98a0b; --track:#e9ecf1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --card:#171b22; --ink:#e8ebf0; --muted:#9aa4b2; --line:#272d37;
    --accent:#6b9bff; --err:#ff7a70; --ok:#47c88b; --warn:#f0b04a; --track:#262c36;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#171b22; --ink:#e8ebf0; --muted:#9aa4b2; --line:#272d37;
  --accent:#6b9bff; --err:#ff7a70; --ok:#47c88b; --warn:#f0b04a; --track:#262c36;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--muted);padding:7px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums}
.delta{font-size:12px;color:var(--muted);margin-top:2px}
.delta.good{color:var(--ok)} .delta.bad{color:var(--err)}
.meter{height:10px;background:var(--track);border-radius:5px;overflow:hidden;margin:10px 0 6px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:5px}
.row2{grid-template-columns:2fr 1fr;margin-bottom:12px}
@media(max-width:820px){.row2{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
td:first-child{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
tr:last-child td{border-bottom:0}
.lat{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.lat .bar{width:90px;height:8px;background:var(--track);border-radius:4px;position:relative}
.lat .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.pill{padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--err)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;display:none;z-index:5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>API usage</h1>
      <div class="sub">Production key <code>sk_live_…4f2a</code> &middot; Sample data</div>
    </div>
    <div class="seg" role="group" aria-label="Time range">
      <button data-r="24h" aria-pressed="false">24 hours</button>
      <button data-r="7d" aria-pressed="true">7 days</button>
      <button data-r="30d" aria-pressed="false">30 days</button>
    </div>
  </header>

  <section class="grid kpis" id="kpis" aria-label="Key metrics"></section>

  <section class="grid row2">
    <div class="card">
      <h2>Requests over time</h2>
      <div class="legend">
        <span><span class="dot" style="background:var(--accent)"></span>Successful</span>
        <span><span class="dot" style="background:var(--err)"></span>Errors (4xx/5xx)</span>
      </div>
      <svg id="chart" viewBox="0 0 640 260" role="img" aria-label="Stacked bar chart of requests over time"></svg>
    </div>
    <div class="card">
      <h2>Monthly quota</h2>
      <div class="big" id="qPct"></div>
      <div class="meter" role="progressbar" aria-label="Quota used" id="qMeter"><i></i></div>
      <div class="sub" id="qText"></div>
      <div class="sub" id="qProj" style="margin-top:10px"></div>
      <div class="sub" style="margin-top:10px">Plan: Growth &middot; resets on the 1st</div>
    </div>
  </section>

  <section class="card">
    <h2>Latency and errors by endpoint</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Endpoint</th><th>Requests</th><th>p50</th><th>p95</th><th>p99</th><th>Error rate</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</div>
<div id="tip"></div>

<script>
(function(){
  // Deterministic pseudo-random so the sample data is stable.
  function rng(seed){return function(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
  var ENDPOINTS=[
    {p:"POST /v1/completions",w:34,lat:420,err:.012},
    {p:"GET /v1/models",w:18,lat:38,err:.002},
    {p:"POST /v1/embeddings",w:22,lat:140,err:.006},
    {p:"GET /v1/files/{id}",w:9,lat:85,err:.019},
    {p:"POST /v1/files",w:6,lat:310,err:.027},
    {p:"DELETE /v1/files/{id}",w:3,lat:60,err:.008},
    {p:"POST /v1/batches",w:8,lat:260,err:.045}
  ];
  var RANGES={
    "24h":{n:24,label:function(i){return (i%24)+":00"},step:"hour",base:42000,every:4},
    "7d":{n:7,label:function(i){return ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i]},step:"day",base:1010000,every:1},
    "30d":{n:30,label:function(i){return "Day "+(i+1)},step:"day",base:980000,every:5}
  };
  var QUOTA={limit:30000000,used:21840000,dayOfMonth:19,daysInMonth:30};
  var fmt=new Intl.NumberFormat("en-US");
  function compact(n){return n>=1e6?(n/1e6).toFixed(n>=1e7?1:2)+"M":n>=1e3?(n/1e3).toFixed(n>=1e5?0:1)+"k":String(Math.round(n))}

  function build(key){
    var cfg=RANGES[key],r=rng(key.length*977+cfg.n);
    var series=[],i,total=0,errs=0;
    for(i=0;i<cfg.n;i++){
      var shape=key==="24h"?(0.55+0.45*Math.sin((i-6)/24*2*Math.PI)):(key==="7d"&&i>4?0.62:1)+Math.sin(i/3)*0.06;
      var req=Math.round(cfg.base*Math.max(.2,shape)*(0.92+r()*0.16));
      var rate=0.011+r()*0.008+((key==="24h"&&i===15)||(key==="7d"&&i===2)||(key==="30d"&&i===21)?0.03:0);
      var e=Math.round(req*rate);
      series.push({label:cfg.label(i),req:req,err:e});
      total+=req;errs+=e;
    }
    var wsum=ENDPOINTS.reduce(function(a,b){return a+b.w},0);
    var rows=ENDPOINTS.map(function(ep){
      var cnt=Math.round(total*ep.w/wsum*(0.97+r()*.06));
      var p50=Math.round(ep.lat*(0.9+r()*.2));
      return {p:ep.p,n:cnt,p50:p50,p95:Math.round(p50*(2.1+r()*.6)),p99:Math.round(p50*(4+r()*1.5)),err:ep.err*(0.85+r()*.3)};
    });
    var wp95=rows.reduce(function(a,b){return a+b.p95*b.n},0)/rows.reduce(function(a,b){return a+b.n},0);
    return {series:series,total:total,errs:errs,rows:rows,p95:wp95,prev:{total:total*(0.9+r()*.06),rate:errs/total*(0.9+r()*.3),p95:wp95*(0.92+r()*.2)}};
  }

  function pctChange(a,b){return (a-b)/b*100}
  function delta(v,goodWhenDown){
    var up=v>=0,good=goodWhenDown?!up:up;
    return '<div class="delta '+(Math.abs(v)<1?"":good?"good":"bad")+'">'+(up?"▲ ":"▼ ")+Math.abs(v).toFixed(1)+'% vs previous period</div>';
  }

  function kpi(title,val,sub){return '<div class="card"><h2>'+title+'</h2><div class="big">'+val+'</div>'+sub+'</div>'}

  function render(key){
    var d=build(key);
    var rate=d.errs/d.total;
    var qp=QUOTA.used/QUOTA.limit;
    var projected=QUOTA.used/QUOTA.dayOfMonth*QUOTA.daysInMonth;
    document.getElementById("kpis").innerHTML=
      kpi("Total requests",fmt.format(d.total),delta(pctChange(d.total,d.prev.total),false))+
      kpi("Error rate",(rate*100).toFixed(2)+"%",delta(pctChange(rate,d.prev.rate),true))+
      kpi("p95 latency",Math.round(d.p95)+" ms",delta(pctChange(d.p95,d.prev.p95),true))+
      kpi("Quota used",(qp*100).toFixed(1)+"%",'<div class="delta">'+compact(QUOTA.limit-QUOTA.used)+' requests left this month</div>');

    // chart
    var W=640,H=260,L=44,B=28,T=10,R=8,pw=W-L-R,ph=H-T-B;
    var max=Math.max.apply(null,d.series.map(function(s){return s.req}));
    var top=Math.ceil(max/ (Math.pow(10,String(Math.floor(max)).length-1)))*Math.pow(10,String(Math.floor(max)).length-1);
    var n=d.series.length,bw=pw/n,bar=Math.min(bw*.7,40),s='',k;
    for(k=0;k<=4;k++){
      var y=T+ph-ph*k/4;
      s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/>'
        +'<text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+compact(top*k/4)+'</text>';
    }
    d.series.forEach(function(p,idx){
      var x=L+bw*idx+(bw-bar)/2,h=ph*(p.req-p.err)/top,eh=ph*p.err/top;
      s+='<g class="b" data-i="'+idx+'">'
        +'<rect x="'+x+'" y="'+(T+ph-h)+'" width="'+bar+'" height="'+h+'" fill="var(--accent)" rx="2"/>'
        +'<rect x="'+x+'" y="'+(T+ph-h-eh)+'" width="'+bar+'" height="'+eh+'" fill="var(--err)" rx="1"/>'
        +'<rect x="'+(L+bw*idx)+'" y="'+T+'" width="'+bw+'" height="'+ph+'" fill="transparent"/></g>';
      if(idx%RANGES[key].every===0)s+='<text x="'+(x+bar/2)+'" y="'+(H-8)+'" text-anchor="middle">'+p.label+'</text>';
    });
    var svg=document.getElementById("chart");
    svg.innerHTML=s;
    var tip=document.getElementById("tip");
    svg.querySelectorAll(".b").forEach(function(g){
      g.addEventListener("mousemove",function(ev){
        var p=d.series[+g.dataset.i];
        tip.style.display="block";
        tip.style.left=(ev.clientX+12)+"px";tip.style.top=(ev.clientY+12)+"px";
        tip.textContent=p.label+": "+fmt.format(p.req)+" requests, "+fmt.format(p.err)+" errors ("+(p.err/p.req*100).toFixed(2)+"%)";
      });
      g.addEventListener("mouseleave",function(){tip.style.display="none"});
    });

    // quota
    document.getElementById("qPct").textContent=(qp*100).toFixed(1)+"%";
    var m=document.getElementById("qMeter");
    m.setAttribute("aria-valuenow",(qp*100).toFixed(1));m.setAttribute("aria-valuemin","0");m.setAttribute("aria-valuemax","100");
    m.firstElementChild.style.width=(qp*100)+"%";
    m.firstElementChild.style.background=qp>.9?"var(--err)":qp>.75?"var(--warn)":"var(--accent)";
    document.getElementById("qText").textContent=fmt.format(QUOTA.used)+" of "+fmt.format(QUOTA.limit)+" requests";
    var over=projected>QUOTA.limit;
    document.getElementById("qProj").innerHTML="Projected month end: <b style='color:"+(over?"var(--err)":"var(--ink)")+"'>"+compact(projected)+"</b> ("+(projected/QUOTA.limit*100).toFixed(0)+"% of quota)"+(over?" &mdash; on track to exceed":"");

    // table
    var maxP99=Math.max.apply(null,d.rows.map(function(x){return x.p99}));
    d.rows.sort(function(a,b){return b.n-a.n});
    document.getElementById("rows").innerHTML=d.rows.map(function(x){
      var cls=x.err>.03?"bad":x.err>.015?"warn":"ok";
      function lat(v){return '<div class="lat"><span>'+v+' ms</span></div>'}
      return '<tr><td>'+x.p+'</td><td>'+fmt.format(x.n)+'</td><td>'+lat(x.p50)+'</td>'
        +'<td><div class="lat"><div class="bar"><i style="width:'+(x.p95/maxP99*100)+'%"></i></div><span>'+x.p95+' ms</span></div></td>'
        +'<td>'+lat(x.p99)+'</td>'
        +'<td><span class="pill '+cls+'">'+(x.err*100).toFixed(2)+'%</span></td></tr>';
    }).join("");

    document.querySelectorAll(".seg button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.r===key)});
  }

  document.querySelectorAll(".seg button").forEach(function(b){
    b.addEventListener("click",function(){render(b.dataset.r)});
  });
  render("7d");
})();
</script>
</body>
</html>

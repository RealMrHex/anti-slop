<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hearth &amp; Pine: Handmade oak furniture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4efe7;
      --surface: #fbf8f3;
      --ink: #26221e;
      --ink-2: #5b534a;
      --ink-3: #847a70;
      --line: rgba(38, 34, 30, 0.1);
      --accent: #2e4a3b;
      --accent-ink: #ffffff;
      --oak: #b98f62;
      --oak-deep: #8c6844;
      --oak-shade: #9a7450;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 8px;
    }

    .page { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

    /* Header */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 32px;
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-2);
    }

    .nav a { transition: color 200ms var(--ease); }
    .nav a:hover { color: var(--ink); }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
      align-items: center;
      gap: 64px;
      min-height: calc(100vh - 80px);
      padding: 40px 0 72px;
    }

    .eyebrow {
      margin: 0 0 20px;
      font-size: 15px;
      font-weight: 500;
      color: var(--oak-deep);
    }

    h1 {
      margin: 0;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 400;
      font-size: clamp(40px, 5vw, 60px);
      line-height: 1.08;
      letter-spacing: -0.015em;
      color: var(--ink);
      max-width: 14ch;
    }

    .lede {
      margin: 24px 0 0;
      max-width: 44ch;
      font-size: 18px;
      line-height: 1.6;
      color: var(--ink-2);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 36px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      height: 48px;
      padding: 0 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      transition: background-color 200ms var(--ease), border-color 200ms var(--ease), color 200ms var(--ease);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .btn-primary:hover { background: #3a5b4a; }

    .btn-secondary {
      border: 1px solid rgba(38, 34, 30, 0.2);
      color: var(--ink);
    }
    .btn-secondary:hover { border-color: rgba(38, 34, 30, 0.4); background: var(--surface); }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, auto);
      justify-content: start;
      gap: 0 40px;
      margin: 48px 0 0;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .facts div { display: grid; gap: 4px; }

    .facts dt {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-3);
    }

    .facts dd {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    /* Product drawing */
    .product {
      margin: 0;
      background: #e7ddcd;
      border-radius: 20px;
      padding: 40px 32px 28px;
    }

    .product svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .product figcaption {
      margin-top: 16px;
      font-size: 14px;
      color: var(--ink-2);
    }

    @media (max-width: 900px) {
      .page { padding: 0 20px; }
      .top { height: 72px; }
      .nav { gap: 20px; font-size: 14px; }
      .hero {
        grid-template-columns: 1fr;
        gap: 48px;
        padding: 32px 0 56px;
      }
      h1 { max-width: none; }
      .facts { gap: 0 28px; }
    }

    @media (max-width: 480px) {
      .nav { gap: 14px; }
      .nav a:nth-child(3) { display: none; }
      .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 12px; }
      .facts dd { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="brand" href="#" aria-label="Hearth and Pine home">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <polygon points="11,2 19,16 3,16" fill="#2e4a3b"></polygon>
          <rect x="9.5" y="16" width="3" height="4" fill="#2e4a3b"></rect>
        </svg>
        <span>Hearth &amp; Pine</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#">Shop</a>
        <a href="#">Custom</a>
        <a href="#">Our story</a>
        <a href="#">Cart (0)</a>
      </nav>
    </header>

    <main class="hero">
      <div class="copy">
        <p class="eyebrow">Crafted by hand in our workshop</p>
        <h1>Oak tables and chairs, built by hand to order</h1>
        <p class="lede">Each piece is made to order, with a 6 week lead time.</p>
        <div class="actions">
          <a class="btn btn-primary" href="#">Shop furniture</a>
          <a class="btn btn-secondary" href="#">Build your own</a>
        </div>
        <dl class="facts">
          <div><dt>Material</dt><dd>Solid oak</dd></div>
          <div><dt>Made</dt><dd>To order</dd></div>
          <div><dt>Lead time</dt><dd>6 weeks</dd></div>
        </dl>
      </div>

      <figure class="product">
        <svg viewBox="0 0 520 400" role="img" aria-label="Drawing of a solid oak dining table with a ceramic cup on top">
          <!-- floor line -->
          <rect x="0" y="322" width="520" height="78" fill="#dccfbc"></rect>
          <line x1="0" y1="322" x2="520" y2="322" stroke="rgba(38,34,30,0.08)" stroke-width="1"></line>

          <!-- contact shadow -->
          <ellipse cx="260" cy="326" rx="196" ry="9" fill="rgba(38,34,30,0.14)"></ellipse>

          <!-- rear legs -->
          <rect x="132" y="196" width="18" height="122" fill="#7d5c3c"></rect>
          <rect x="370" y="196" width="18" height="122" fill="#7d5c3c"></rect>

          <!-- apron -->
          <rect x="128" y="212" width="264" height="14" fill="#9a7450"></rect>

          <!-- front legs -->
          <rect x="108" y="200" width="24" height="124" fill="#a47d56"></rect>
          <rect x="388" y="200" width="24" height="124" fill="#a47d56"></rect>

          <!-- top surface -->
          <polygon points="60,176 460,176 498,150 98,150" fill="#c9a071"></polygon>
          <!-- top front edge -->
          <rect x="60" y="176" width="400" height="26" rx="2" fill="#b98f62"></rect>
          <rect x="60" y="176" width="400" height="3" fill="#cfa97c"></rect>

          <!-- grain -->
          <g fill="none" stroke="rgba(90,60,30,0.2)" stroke-width="1.2" stroke-linecap="round">
            <path d="M78 186 Q 190 181 300 188 T 448 185"></path>
            <path d="M92 194 Q 210 191 330 196 T 440 193"></path>
            <path d="M120 159 Q 230 156 340 161 T 470 157" opacity="0.7"></path>
            <path d="M150 166 Q 250 164 360 168 T 448 166" opacity="0.6"></path>
          </g>

          <!-- ceramic cup -->
          <ellipse cx="346" cy="150" rx="16" ry="4" fill="#efe8dc"></ellipse>
          <path d="M330 150 L332 124 Q346 120 360 124 L362 150 Q346 154 330 150 Z" fill="#f7f2ea" stroke="rgba(38,34,30,0.12)" stroke-width="1"></path>
          <path d="M360 129 Q372 130 371 139 Q370 146 361 146" fill="none" stroke="#f7f2ea" stroke-width="3"></path>

          <!-- dimension line -->
          <g stroke="#847a70" stroke-width="1.2" fill="none">
            <line x1="60" y1="112" x2="460" y2="112"></line>
            <line x1="60" y1="104" x2="60" y2="120"></line>
            <line x1="460" y1="104" x2="460" y2="120"></line>
          </g>
        </svg>
        <figcaption>Dining table in solid oak, made to order</figcaption>
      </figure>
    </main>
  </div>
</body>
</html>

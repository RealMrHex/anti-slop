<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<style>
  :root {
    --bg: #f4f1ec;
    --card: #ffffff;
    --text: #1f2a24;
    --muted: #7b857f;
    --accent: #1f7a5c;
    --accent-soft: #dcefe7;
    --border: #e6e1d8;
    --shadow: 0 1px 2px rgba(31,42,36,.06), 0 6px 16px rgba(31,42,36,.05);
    --on-accent: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121815; --card: #1b2420; --text: #eef3ef; --muted: #8e9b94;
      --accent: #3fc08f; --accent-soft: #1f3a2f; --border: #28332d;
      --shadow: 0 1px 2px rgba(0,0,0,.3); --on-accent: #08241a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121815; --card: #1b2420; --text: #eef3ef; --muted: #8e9b94;
    --accent: #3fc08f; --accent-soft: #1f3a2f; --border: #28332d;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --on-accent: #08241a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .screen { max-width: 480px; margin: 0 auto; padding: 28px 20px 40px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0; }
  header h1 { font-size: 38px; line-height: 1.05; letter-spacing: -.03em; margin: 6px 0 18px; font-weight: 750; }
  .progress { background: var(--card); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 22px; }
  .progress p { margin: 0 0 10px; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; }
  .progress p b { color: var(--text); font-weight: 600; }
  .bar { height: 8px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
  form.add {
    display: flex; gap: 6px; margin-bottom: 20px; padding: 6px;
    background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  form.add:focus-within { border-color: var(--accent); }
  form.add input[type="text"] {
    flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; border: none; outline: none;
    background: transparent; color: var(--text); font-family: inherit;
  }
  form.add input::placeholder { color: var(--muted); }
  form.add button {
    padding: 10px 18px; font-size: 15px; font-weight: 600; border: none; border-radius: 11px;
    background: var(--accent); color: var(--on-accent); cursor: pointer; font-family: inherit;
  }
  form.add button:active { transform: scale(.97); }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex; align-items: center; gap: 14px; background: var(--card);
    border-radius: 16px; padding: 14px 14px 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow);
  }
  li label { flex: 1; font-size: 16px; line-height: 1.35; cursor: pointer; word-break: break-word; transition: color .2s; }
  li.done label { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
  li input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; flex: none; margin: 0;
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted);
    display: grid; place-content: center; cursor: pointer; background: transparent;
    transition: background .15s, border-color .15s;
  }
  li input[type="checkbox"]::after {
    content: ""; width: 6px; height: 11px; border: solid var(--on-accent); border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg) translate(-1px,-1px) scale(0); transition: transform .15s;
  }
  li input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  li input[type="checkbox"]:checked::after { transform: rotate(45deg) translate(-1px,-1px) scale(1); }
  li input[type="checkbox"]:focus-visible, form.add button:focus-visible, li button.del:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  li button.del {
    background: none; border: none; color: var(--muted); font-size: 22px; line-height: 1;
    cursor: pointer; width: 32px; height: 32px; border-radius: 50%;
  }
  li button.del:hover { background: var(--accent-soft); color: var(--text); }
  .empty { text-align: center; color: var(--muted); padding: 36px 0; font-size: 15px; }
</style>
</head>
<body>
<div class="screen">
  <header>
    <p class="eyebrow" id="date"></p>
    <h1>Today</h1>
  </header>

  <section class="progress" aria-live="polite">
    <p><span id="count"></span><b id="pct"></b></p>
    <div class="bar"><i id="fill"></i></div>
  </section>

  <form class="add" id="addForm">
    <input type="text" id="newTask" placeholder="Add a task" aria-label="New task" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>Nothing to do. Enjoy the quiet.</div>
</div>

<script>
  var tasks = [
    { id: 1, text: "Buy groceries", done: false },
    { id: 2, text: "Reply to Sam's email", done: false },
    { id: 3, text: "Book dentist appointment", done: true }
  ];
  var nextId = 4;

  var list = document.getElementById("list");
  var countEl = document.getElementById("count");
  var emptyEl = document.getElementById("empty");
  var form = document.getElementById("addForm");
  var input = document.getElementById("newTask");

  function render() {
    list.innerHTML = "";
    tasks.forEach(function (t) {
      var li = document.createElement("li");
      if (t.done) li.className = "done";

      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = t.done;
      cb.id = "t" + t.id;
      cb.addEventListener("change", function () {
        t.done = cb.checked;
        render();
      });

      var label = document.createElement("label");
      label.htmlFor = "t" + t.id;
      label.textContent = t.text;

      var del = document.createElement("button");
      del.className = "del";
      del.setAttribute("aria-label", "Delete task");
      del.textContent = "×";
      del.addEventListener("click", function () {
        tasks = tasks.filter(function (x) { return x.id !== t.id; });
        render();
      });

      li.appendChild(cb);
      li.appendChild(label);
      li.appendChild(del);
      list.appendChild(li);
    });

    var remaining = tasks.filter(function (t) { return !t.done; }).length;
    countEl.textContent = remaining + " of " + tasks.length + " remaining";
    var pc = tasks.length ? Math.round((tasks.length - remaining) / tasks.length * 100) : 0;
    document.getElementById("pct").textContent = pc + "%";
    document.getElementById("fill").style.width = pc + "%";
    emptyEl.hidden = tasks.length > 0;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: nextId++, text: text, done: false });
    input.value = "";
    render();
    input.focus();
  });

  document.getElementById("date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  render();
</script>
</body>
</html>

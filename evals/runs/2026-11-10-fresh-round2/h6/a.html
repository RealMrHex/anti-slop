<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loomdesk - Salon scheduling</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f4ee;
      --card: #fdfbf7;
      --raised: #efe9df;
      --ink: #1f1b16;
      --ink-2: #5e554a;
      --ink-3: #7b7266;
      --hair: rgba(31, 27, 22, 0.08);
      --hair-strong: rgba(31, 27, 22, 0.16);
      --accent: #b5532f;
      --accent-hover: #9c4526;
      --green: #16a34a;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Instrument Sans', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body { min-height: 100vh; }

    a { color: inherit; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* Navigation */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      gap: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
    }
    .brand svg { width: 22px; height: 22px; }
    .links { display: flex; gap: 28px; font-size: 15px; color: var(--ink-2); }
    .links a { text-decoration: none; }
    .links a:hover { color: var(--ink); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.16s, border-color 0.16s, color 0.16s;
    }
    .btn.sm { height: 36px; padding: 0 14px; }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.ghost { border: 1px solid var(--hair-strong); color: var(--ink); }
    .btn.ghost:hover { background: var(--raised); }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 56px;
      align-items: center;
      padding: 48px 0 80px;
    }
    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(42px, 6vw, 72px);
      line-height: 1.04;
      letter-spacing: -0.02em;
      max-width: 13ch;
    }
    .sub {
      margin-top: 20px;
      font-size: 19px;
      line-height: 1.5;
      color: var(--ink-2);
      max-width: 34rem;
    }
    .actions { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }

    /* Preview card */
    .card {
      background: var(--card);
      border: 1px solid var(--hair);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(31, 27, 22, 0.06);
      padding: 20px;
    }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .card-title { font-size: 15px; font-weight: 500; }
    .today { font-size: 13px; color: var(--ink-3); }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--ink-3);
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .swatch { width: 8px; height: 8px; border-radius: 2px; background: var(--tone); }

    .cal-head {
      display: grid;
      grid-template-columns: 52px repeat(3, 1fr);
      margin-top: 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
    }
    .cal-head div { padding-left: 8px; }

    .cal-body { position: relative; height: 336px; margin-top: 8px; }
    .times { position: absolute; left: 0; top: 0; width: 52px; height: 100%; }
    .times span {
      position: absolute;
      left: 0;
      font-size: 12px;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
      line-height: 16px;
    }
    .lanes {
      position: absolute;
      left: 52px;
      right: 0;
      top: 0;
      bottom: 0;
      background-image: repeating-linear-gradient(to bottom, var(--hair) 0 1px, transparent 1px 56px);
    }

    .block {
      position: absolute;
      top: var(--t);
      height: var(--h);
      left: calc(var(--c) * 33.3333% + 4px);
      width: calc(33.3333% - 8px);
      padding: 6px 8px 6px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--tone);
      background: var(--tint);
      z-index: 1;
      font-size: 13px;
      line-height: 1.3;
      overflow: hidden;
    }
    .block small {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    .block.open {
      background: transparent;
      border: 1px dashed var(--hair-strong);
      color: var(--ink-3);
      padding-left: 9px;
    }

    .clay  { --tint: #f4e1d6; --tone: #b5532f; }
    .sage  { --tint: #e3eadc; --tone: #6f8a68; }
    .ochre { --tint: #f6ebcc; --tone: #a87a1e; }
    .slate { --tint: #e3e6ec; --tone: #5d6676; }

    .now {
      position: absolute;
      left: 0;
      right: 0;
      top: 75px;
      z-index: 0;
      border-top: 1px solid var(--accent);
    }
    .now::before {
      content: "";
      position: absolute;
      left: -4px;
      top: -4px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .foot {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--hair);
      font-size: 13px;
      color: var(--ink-2);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }

    /* One entrance, short and quiet */
    .rise { animation: rise 0.4s var(--ease) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @media (min-width: 960px) {
      .hero {
        grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
        gap: 64px;
        padding: 16px 0 56px;
        min-height: calc(100vh - 72px);
      }
    }
    @media (max-width: 860px) {
      .links { display: none; }
    }
    @media (max-width: 480px) {
      .wrap { padding: 0 16px; }
      .cal-head, .cal-body { font-size: 12px; }
      .block { font-size: 12px; padding: 4px 6px 4px 8px; }
      .block small { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .rise { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="nav">
      <a class="brand" href="#" aria-label="Loomdesk home">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6c3.5 0 3.5 12 8 12s4.5-12 8-12" />
          <path d="M4 18c3.5 0 3.5-12 8-12s4.5 12 8 12" opacity="0.45" />
        </svg>
        Loomdesk
      </a>
      <nav class="links" aria-label="Main">
        <a href="#">Features</a>
        <a href="#">Pricing</a>
        <a href="#">Stories</a>
        <a href="#">Blog</a>
      </nav>
      <a class="btn primary sm" href="#">Start free trial</a>
    </header>

    <main class="hero">
      <section class="copy rise">
        <h1>Fill every chair. Cut the no-shows</h1>
        <p class="sub">Booking, staff rota and text reminders for salons, in one calendar.</p>
        <div class="actions">
          <a class="btn primary" href="#">Start free trial</a>
          <a class="btn ghost" href="#">Watch demo</a>
        </div>
      </section>

      <figure class="card preview rise" style="animation-delay: 0.08s" aria-label="Week view of the salon calendar">
        <div class="card-head">
          <span class="card-title">Week of 9 November</span>
          <span class="today">Today</span>
        </div>
        <div class="legend" aria-hidden="true">
          <span class="clay"><i class="swatch"></i>Colour</span>
          <span class="sage"><i class="swatch"></i>Cut</span>
          <span class="ochre"><i class="swatch"></i>Blow dry</span>
          <span class="slate"><i class="swatch"></i>Treatment and beard</span>
        </div>

        <div class="cal-head" aria-hidden="true">
          <div></div>
          <div>Mara</div>
          <div>Jonas</div>
          <div>Priya</div>
        </div>

        <div class="cal-body">
          <div class="times" aria-hidden="true">
            <span style="top: 0">9:00</span>
            <span style="top: 56px">10:00</span>
            <span style="top: 112px">11:00</span>
            <span style="top: 168px">12:00</span>
            <span style="top: 224px">13:00</span>
            <span style="top: 280px">14:00</span>
          </div>

          <div class="lanes">
            <!-- Mara -->
            <div class="block clay" style="--c: 0; --t: 2px; --h: 80px;">
              Ana Ruiz
              <small>Colour, 9:00</small>
            </div>
            <div class="block sage" style="--c: 0; --t: 114px; --h: 52px;">
              Tom Berg
              <small>Cut, 11:00</small>
            </div>
            <div class="block ochre" style="--c: 0; --t: 226px; --h: 52px;">
              Ines Vale
              <small>Blow dry, 1:00</small>
            </div>

            <!-- Jonas -->
            <div class="block sage" style="--c: 1; --t: 30px; --h: 52px;">
              Sam Idris
              <small>Cut, 9:30</small>
            </div>
            <div class="block slate" style="--c: 1; --t: 142px; --h: 82px;">
              Dev Park
              <small>Beard trim, 11:30</small>
            </div>

            <!-- Priya -->
            <div class="block open" style="--c: 2; --t: 2px; --h: 52px;">
              Free
              <small>9:00</small>
            </div>
            <div class="block slate" style="--c: 2; --t: 58px; --h: 52px;">
              Mei Chen
              <small>Treatment, 10:00</small>
            </div>
            <div class="block clay" style="--c: 2; --t: 170px; --h: 52px;">
              Lena Okafor
              <small>Colour, 12:00</small>
            </div>
            <div class="block ochre" style="--c: 2; --t: 254px; --h: 52px;">
              Ola Brandt
              <small>Blow dry, 1:30</small>
            </div>

            <div class="now" aria-hidden="true"></div>
          </div>
        </div>

        <div class="foot">
          <span class="dot" aria-hidden="true"></span>
          Reminder sent to Lena Okafor, 2 hours before
        </div>
      </figure>
    </main>
  </div>
</body>
</html>
